<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyNotes demo</title>
  <meta name="description" content="Study notes, explanations and quizzes for Bachelor of Accounting (Tanzania)">
  <meta name="theme-color" content="#0f5f57">
  
  <!-- iPhone / Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StudyNotes">
  
  
  <meta name="format-detection" content="telephone=no">
  <style>[hidden] { display: none !important; }
:root {
  --bg: #f4f6f5; --card: #ffffff; --text: #17201e; --muted: #5d6b67; --line: #dfe5e3;
  --brand: #0f5f57; --brand-2: #e7f2f0; --ok: #16794c; --ok-bg: #e5f5ec; --bad: #b3261e; --bad-bg: #fbeaea;
  --warn: #9a6500; --warn-bg: #fff4dc; --radius: 14px; --tap: 44px;
  --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1413; --card: #182120; --text: #e6eeec; --muted: #9aaaa6; --line: #2a3533;
    --brand: #4fbfae; --brand-2: #1d3330; --ok: #5bd197; --ok-bg: #163126; --bad: #ff8a80; --bad-bg: #3a1c1a;
    --warn: #f0c36a; --warn-bg: #3a2f17; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--text); padding-bottom: calc(70px + var(--safe-bottom)); }
a { color: var(--brand); }
h1, h2, h3 { line-height: 1.25; margin: 0 0 .5rem; }
h2 { font-size: 1.25rem; } h3 { font-size: 1.05rem; }

/* Header */
.top { position: sticky; top: 0; z-index: 10; background: var(--brand); color: #fff;
  padding: calc(8px + var(--safe-top)) 14px 8px; box-shadow: 0 1px 6px rgba(0,0,0,.15); }
@media (prefers-color-scheme: dark) { .top { background: #10302c; } }
.top-row { display: flex; align-items: center; justify-content: space-between; }
.top h1 { font-size: 1.15rem; margin: 0; letter-spacing: .2px; }
.icon-btn { background: transparent; border: 0; font-size: 1.3rem; min-width: var(--tap); min-height: var(--tap); cursor: pointer; }
.status-row { display: flex; align-items: center; gap: 10px; font-size: .85rem; flex-wrap: wrap; min-height: 28px; }
.conn { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: #ccc; }
.dot.ok { background: #5be39a; } .dot.bad { background: #ff7b72; } .dot.warn { background: #ffd166; }
.queue-pill { background: rgba(255,255,255,.2); padding: 1px 9px; border-radius: 99px; font-weight: 600; }

.wrap { max-width: 760px; margin: 0 auto; padding: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }

/* Bunnfaner */
.tabs { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--card); border-top: 1px solid var(--line);
  padding-bottom: var(--safe-bottom); z-index: 10; }
.tabs a { flex: 1; text-align: center; text-decoration: none; color: var(--muted); padding: 7px 0 6px; font-size: .75rem; display: flex; flex-direction: column; align-items: center; }
.tabs a b { font-size: 1.25rem; line-height: 1.2; }
.tabs a.active { color: var(--brand); font-weight: 600; }

/* Skjema */
textarea, input, select { width: 100%; font: inherit; font-size: 16px; /* hindrer zoom på iOS */
  color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: var(--tap); }
textarea { resize: vertical; }
textarea:focus, input:focus, select:focus { outline: 2px solid var(--brand); outline-offset: 0; }
.field { display: block; margin: 0 0 10px; } .field > span { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 3px; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: var(--tap); padding: 0 16px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-weight: 600; cursor: pointer;
  -webkit-tap-highlight-color: transparent; position: relative; }
.btn.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
@media (prefers-color-scheme: dark) { .btn.primary { color: #06201c; } }
.btn.ghost { background: transparent; } .btn.danger { color: var(--bad); }
.btn.block { width: 100%; margin-top: 10px; } .btn.small { min-height: 36px; padding: 0 12px; font-size: .9rem; }
.btn.tiny { min-height: 28px; padding: 0 10px; font-size: .8rem; background: #fff; color: var(--brand); border: 0; }
.btn:disabled { opacity: .55; }
.row { display: flex; gap: 8px; align-items: center; margin: 10px 0; } .row.wrap { flex-wrap: wrap; } .row.end { justify-content: flex-end; }
.msg { padding: 10px 12px; border-radius: 10px; margin: 10px 0 0; font-size: .95rem; }
.msg:empty { display: none; }
.msg.ok { background: var(--ok-bg); color: var(--ok); } .msg.bad { background: var(--bad-bg); color: var(--bad); } .msg.warn { background: var(--warn-bg); color: var(--warn); }
.ok-text { color: var(--ok); } .bad-text { color: var(--bad); }
.muted { color: var(--muted); } .small { font-size: .82rem; } .center { text-align: center; } .pad { padding: 18px 0; } .big { font-size: 1.6rem; font-weight: 700; margin: 6px 0; }
.hint { font-size: .85rem; color: var(--muted); text-align: center; }
.pre { white-space: pre-wrap; word-wrap: break-word; }

.preview { display: flex; gap: 12px; align-items: center; margin-top: 8px; }
.preview img { width: 96px; height: 96px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
.noimg { width: 96px; height: 96px; display: grid; place-items: center; border-radius: 10px; background: var(--brand-2); font-size: .7rem; padding: 4px; text-align: center; word-break: break-all; }

.qlist { list-style: none; padding: 0; margin: 0; }
.qlist li { display: flex; gap: 6px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.qmain { flex: 1; min-width: 0; } .qmain > div:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Filtre */
.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0 10px; }

/* Notatkort */
.note-card { display: flex; gap: 12px; text-decoration: none; color: inherit; }
.note-card .thumb { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; flex: none; background: var(--brand-2); }
.nc-body { flex: 1; min-width: 0; }
.nc-top { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 4px; }
.note-card h3 { margin: 2px 0; }
.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin: 2px 0; font-size: .9rem; }
.tag { font-size: .72rem; background: var(--brand-2); color: var(--brand); padding: 2px 8px; border-radius: 99px; font-weight: 600; }
.badge { font-size: .72rem; padding: 2px 8px; border-radius: 99px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
.badge.ok { background: var(--ok-bg); color: var(--ok); } .badge.bad { background: var(--bad-bg); color: var(--bad); } .badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.diff-lett { background: var(--ok-bg); color: var(--ok); } .badge.diff-medium { background: var(--warn-bg); color: var(--warn); } .badge.diff-hard { background: var(--bad-bg); color: var(--bad); }
.back { display: inline-block; margin: 2px 0 10px; text-decoration: none; font-weight: 600; min-height: 32px; }
.note-img { width: 100%; max-height: 420px; object-fit: contain; border-radius: 10px; background: var(--bg); margin: 8px 0; }
details { margin: 8px 0; } summary { cursor: pointer; font-weight: 600; color: var(--brand); min-height: 32px; }

/* Segmentkontroll (forklaringsnivå) */
.seg { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; margin-bottom: 10px; }
.seg button { flex: 1; border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 600; font-size: .9rem; min-height: 38px; border-radius: 9px; cursor: pointer; }
.seg button.active { background: var(--card); color: var(--brand); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.seg.small button { font-size: .82rem; min-height: 32px; }
.expl { line-height: 1.6; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
.chip { border: 1px solid var(--brand); color: var(--brand); background: transparent; border-radius: 99px; padding: 6px 12px; font: inherit; font-size: .85rem; cursor: pointer; min-height: 36px; }
.chip.active { background: var(--brand); color: #fff; }
.chip.static { border-color: var(--line); color: var(--text); min-height: 0; padding: 2px 10px; cursor: default; }
.small-gap { gap: 4px; }

/* MC-oppgaver */
.q { border-top: 1px solid var(--line); padding: 12px 0; }
.q:first-child { border-top: 0; }
.q-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.q-text { font-weight: 600; margin: 8px 0; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--text); font: inherit; cursor: pointer; min-height: var(--tap); -webkit-tap-highlight-color: transparent; }
.opt b { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); font-size: .8rem; }
.opt:disabled { cursor: default; opacity: 1; }
.opt.right { border-color: var(--ok); background: var(--ok-bg); } .opt.right b { background: var(--ok); color: #fff; border-color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); } .opt.wrong b { background: var(--bad); color: #fff; border-color: var(--bad); }
.feedback { margin-top: 10px; padding: 12px; border-radius: 10px; }
.feedback.ok { background: var(--ok-bg); } .feedback.bad { background: var(--bad-bg); }
.feedback .verdict { font-weight: 700; margin: 0 0 6px; }
.feedback.ok .verdict { color: var(--ok); } .feedback.bad .verdict { color: var(--bad); }
.oe { padding-left: 18px; margin: 6px 0 0; } .oe li { margin-bottom: 6px; }
.quiz-top { display: flex; justify-content: space-between; font-weight: 600; font-size: .9rem; }
.bar { height: 10px; background: var(--bg); border-radius: 99px; overflow: hidden; margin: 8px 0; border: 1px solid var(--line); }
.bar.thin { height: 5px; } .bar > div { height: 100%; background: var(--brand); transition: width .3s; }

/* Kalkulator */
.calc-block { padding: 10px 0; border-top: 1px solid var(--line); scroll-margin-top: 110px; transition: background .4s; border-radius: 8px; }
.calc-block:first-child { border-top: 0; }
.calc-block.flash { background: var(--brand-2); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 10px; }
@media (max-width: 420px) { .grid3 { grid-template-columns: 1fr 1fr; } }
.converter input { text-align: right; font-variant-numeric: tabular-nums; }
.rate-input { width: 110px; }
.chips .field { margin: 0; flex: 1; min-width: 110px; }
.result > div { display: flex; justify-content: space-between; padding: 4px 0; font-variant-numeric: tabular-nums; }
.result .total { border-top: 2px solid var(--line); margin-top: 4px; padding-top: 6px; font-size: 1.05rem; }
.result .total.neg b { color: var(--ok); }

/* Dialog og toast */
dialog { border: 0; border-radius: var(--radius); padding: 0; width: min(94vw, 460px); background: var(--card); color: var(--text); }
dialog::backdrop { background: rgba(0,0,0,.45); }
.dlg { padding: 18px; }
#toasts { position: fixed; left: 0; right: 0; bottom: calc(80px + var(--safe-bottom)); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 50; }
.toast { background: #222; color: #fff; padding: 10px 16px; border-radius: 10px; opacity: 0; transform: translateY(8px); transition: .25s; max-width: 90vw; }
.toast.show { opacity: 1; transform: none; } .toast.ok { background: var(--ok); } .toast.bad { background: var(--bad); }

.spin { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: sp 0.8s linear infinite; vertical-align: -1px; }
@keyframes sp { to { transform: rotate(360deg); } }

/* Tipsboks */
.tips { background: var(--brand-2); border-radius: 12px; padding: 8px 12px; margin: 0 0 12px; }
.tips summary { color: var(--brand); }
.tips h4 { margin: 8px 0 4px; font-size: .95rem; }
.tips ul { margin: 0; padding-left: 20px; font-size: .9rem; }
.tips li { margin-bottom: 4px; }
.tips-grid { display: grid; gap: 4px 16px; }
@media (min-width: 640px) { .tips-grid { grid-template-columns: 1fr 1fr; } }
.warn-text { color: var(--warn); margin: 4px 0; }

/* Spør notatene */
.ask-row { display: flex; gap: 8px; }
.ask-row input { flex: 1; }
.answer { background: var(--bg); border-radius: 10px; padding: 12px; margin: 8px 0; line-height: 1.6; }
.ask .badge { margin: 8px 0 0; }

/* Fremgang og eksamensoppgaver */
.check { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 12px; }
.check input { width: 22px; height: 22px; min-height: 0; margin-top: 2px; flex: none; }
.prog-row { margin: 10px 0; }
.prog-head { display: flex; justify-content: space-between; gap: 8px; font-size: .92rem; }
.prog-row .bar { margin: 4px 0; }
.diff-mini { display: flex; gap: 10px; font-size: .75rem; color: var(--muted); }
.exam .scenario { background: var(--bg); border-left: 3px solid var(--brand); padding: 10px 12px; border-radius: 6px; margin: 8px 0 12px; }
.exam .part { border-top: 1px solid var(--line); padding: 10px 0; }
.exam .solution { background: var(--bg); padding: 10px; border-radius: 8px; margin: 6px 0; font-size: .92rem; }
.btn.chosen { background: var(--brand); color: #fff; border-color: var(--brand); }
.btn.danger.chosen { background: var(--bad); border-color: var(--bad); color: #fff; }
.self-score { font-weight: 700; color: var(--brand); }
dialog { max-height: 92vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }

/* Nivå og feil */
.level { margin: 6px 0 2px; display: grid; gap: 4px; justify-items: start; }
.level .steps { display: grid; gap: 2px; color: var(--muted); }
.mist { border-top: 1px solid var(--line); padding: 10px 0; }
.mist:first-of-type { border-top: 0; }
.mopts { list-style: none; padding: 0; margin: 6px 0; display: grid; gap: 4px; }
.mopts li { padding: 6px 10px; border-radius: 8px; background: var(--bg); font-size: .92rem; }
.mopts li.right { background: var(--ok-bg); color: var(--ok); }
.mopts li.wrong { background: var(--bad-bg); color: var(--bad); }

/* Tilbakemelding */
.fb-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
.fb-row .btn.tiny { min-height: 32px; border: 1px solid var(--line); color: var(--text); background: transparent; }
.fb-form { display: flex; gap: 6px; flex: 1 1 100%; }
.fb-form input { min-height: 36px; padding: 6px 10px; }

/* Navn og neste steg */
.top-row { gap: 8px; }
.top-row h1 { flex: 1; }
.name-chip { background: rgba(255,255,255,.16); color: #fff; border: 0; border-radius: 99px; padding: 6px 12px;
  font: inherit; font-size: .85rem; font-weight: 600; max-width: 45vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 36px; }
.name-chip.empty { background: #fff; color: var(--brand); }
.name-card { border: 2px solid var(--brand); }
.next-card { border-left: 4px solid var(--brand); }
.next-list { margin: 6px 0; padding-left: 20px; display: grid; gap: 8px; }
.next-list li { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.next-list li span { flex: 1; }

/* AI-supplement og hull */
.tag.ai { background: #efe7ff; color: #5b34b5; }
@media (prefers-color-scheme: dark) { .tag.ai { background: #2c2147; color: #c9b5ff; } }
.ai-note { background: #f3eeff; border-left: 3px solid #7b54d6; padding: 8px 10px; border-radius: 6px; font-size: .88rem; }
@media (prefers-color-scheme: dark) { .ai-note { background: #231c36; } }
.gaps .gap { border-top: 1px solid var(--line); padding: 8px 0; }
.gaps .gap p { margin: 4px 0; }

/* Innlogging */
body.login-mode .tabs, body.login-mode #syncBtn { display: none; }
.login-card { max-width: 420px; margin: 24px auto; }
.account { background: var(--bg); border-radius: 10px; padding: 10px 12px; margin: 0 0 12px; }
.account p { margin: 0 0 6px; }

.check-row{display:flex;gap:.6rem;align-items:flex-start;margin:.4rem 0 .9rem;cursor:pointer}
.check-row input{width:1.3rem;height:1.3rem;margin-top:.1rem;flex:none}
body.login-mode #nameChip{display:none!important}
.period-bar { margin: 4px 0 10px; }
.period-bar .chip { min-height: 34px; padding: 5px 11px; }
.period-bar .cnt { opacity: .7; font-size: .8em; margin-left: 2px; }
details.when { margin: 8px 0 12px; }
details.when summary { cursor: pointer; font-size: .92rem; }
details.when .field, .when-edit .field { flex: 1; min-width: 130px; margin: 6px 0 0; }
.when-edit { align-items: flex-end; margin-bottom: 8px; }
.linkbtn { background: none; border: 0; color: var(--brand); font: inherit; text-decoration: underline; padding: 0 4px; cursor: pointer; }
details.sem-dates { margin: 10px 0; padding: 8px 10px; border: 1px solid var(--line, #ddd); border-radius: 12px; }
details.sem-dates summary { cursor: pointer; font-weight: 600; }
.sem-row { align-items: flex-end; gap: 8px; margin: 6px 0; }
.sem-row .sem-name { width: 100%; font-size: .9rem; }
.sem-row .field { flex: 1; min-width: 120px; margin: 0; }
.sem-row .field input, .when-edit .field input, details.when .field input { padding-left: 8px; padding-right: 6px; font-size: .95rem; min-width: 0; width: 100%; box-sizing: border-box; }
#fileBox .field { flex-basis: 100%; }
.chips.scroll-x { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 2px; }
.chips.scroll-x::-webkit-scrollbar { display: none; }
.chips.scroll-x .chip, .chips.scroll-x > span { flex: none; white-space: nowrap; }
.chip.mine { border-color: #b7791f; color: #8a5a12; }
.chip.mine.active { background: #b7791f; color: #fff; }
.chip.ghost { border-style: dashed; }
.chip.small { min-height: 30px; padding: 3px 10px; font-size: .8rem; }
.filebar { margin: 8px 0 10px; }
.filebar .fb-lbl { margin-bottom: 2px; }
#fileEdit .field { flex-basis: 100%; margin: 6px 0 0; }
.mytopics { margin: 0 0 8px; align-items: center; }
.tag.mine { background: #fdf1dc; color: #8a5a12; }
.tag.aitopic { background: #eef1f0; color: #5b6b66; font-weight: 500; }
.topic-origin { margin: -4px 0 6px; color: #8a5a12; }
@media (prefers-color-scheme: dark) {
  .tag.mine { background: #3a2c14; color: #f0c674; } .chip.mine { color: #f0c674; border-color: #c9952e; }
  .tag.aitopic { background: #26302d; color: #a9b8b3; } .topic-origin { color: #f0c674; }
}
.filter-box { margin: 4px 0 10px; }
.filter-box > summary { list-style: none; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.filter-box > summary::-webkit-details-marker { display: none; }
.filter-box[open] > summary { margin-bottom: 6px; }
.filter-box .linkbtn { margin-left: 8px; }
.badge-n { background: var(--brand); color: #fff; border-radius: 99px; padding: 0 7px; font-size: .75rem; }
.ask-sub { margin: -4px 0 8px; }
.transcript { margin: 10px 0; padding: 10px 12px; border: 1px solid var(--line, #d9e0dd); border-radius: 12px; }
.transcript .tr-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.transcript textarea { width: 100%; box-sizing: border-box; }
/* iPhone: et trykk på en knapp skal aldri markere tekst («Copy / Look Up»-menyen) */
button, .btn, .chip, summary, nav a { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.up-prog { margin: 4px 0 8px; }
.up-prog .bar { height: 6px; background: var(--line, #d9e0dd); border-radius: 99px; overflow: hidden; margin-top: 4px; }
.up-prog .bar i { display: block; height: 100%; background: var(--brand); transition: width .3s; }
.qlist li { align-items: flex-start; }
.qrow { margin-top: 3px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.qstate.retry, .qstate.failed { color: #b45309; }
.qstate.done { color: var(--brand); font-weight: 600; }
.qbar { height: 5px; background: var(--line, #d9e0dd); border-radius: 99px; overflow: hidden; margin-top: 5px; max-width: 260px; }
.qbar i { display: block; height: 100%; width: 0; background: var(--brand); transition: width .35s; }
.qbar.done i { background: #22a06b; }

  <script>(()=>{function gn(e,t){let a=e.map((n,r)=>r),s=t;for(let n=a.length-1;n>0;n--){s=(s*9301+49297)%233280;let r=s%(n+1);[a[n],a[r]]=[a[r],a[n]]}return{options:a.map(n=>e[n]),correct_index:a.indexOf(0)}}var sa=0;function j(e,t,a,s,n,[r,c,u],b,m,f,w={}){return sa++,{subject:e,topic:t,days:a,text:s,summary:n,explanations:{enkel:r,avansert:c,svaert_avansert:u},key_terms:b,standards:m,questions:f.map(([v,o,p,k],S)=>({difficulty:v,question:o,...gn(p,sa*7+S),explanation:k})),...w}}var ae="Finansregnskap",pe="Skatterett",ye="Revisjon",We="Bedrifts\xF8konomi",Ke="\xD8konomistyring",Ge="Finansiering og investering",wt="Foretaksrett",ra={id:"no",lang:"no",label:"\u{1F1F3}\u{1F1F4} Norge \u2013 \xF8konomi og adm.",subjects:[ae,pe,ye,We,Ke,Ge,wt,"Annet"],notes:[j(ae,"Grunnleggende regnskapsprinsipper (rskl \xA7 4-1)",2,"Forelesning 3: grunnleggende prinsipper rskl \xA7 4-1. Transaksjon, opptjening, sammenstilling, forsiktighet, sikring. Eks: vare levert 20.12, betalt 10.01 -> inntekt i desember!","Notatet g\xE5r gjennom de grunnleggende regnskapsprinsippene i regnskapsloven \xA7 4-1: inntekter f\xF8res n\xE5r de er opptjent, og kostnader sammenstilles med inntektene de h\xF8rer til.",[`Regnskapet skal vise n\xE5r noe faktisk skjer, ikke n\xE5r pengene kommer. Leverer du en vare 20. desember, er inntekten opptjent i desember \u2013 selv om kunden betaler i januar.

Kostnader f\xF8res i samme periode som inntektene de hjelper til \xE5 skape. Varekostnaden f\xF8res derfor n\xE5r varen selges, ikke n\xE5r den kj\xF8pes inn.`,`Rskl \xA7 4-1 f\xF8rste ledd:
\u2022 Transaksjonsprinsippet: transaksjoner f\xF8res til verdien av vederlaget p\xE5 transaksjonstidspunktet.
\u2022 Opptjeningsprinsippet: inntekt resultatf\xF8res n\xE5r den er opptjent \u2013 normalt ved levering, n\xE5r risiko og kontroll er g\xE5tt over.
\u2022 Sammenstillingsprinsippet: utgifter kostnadsf\xF8res i samme periode som tilh\xF8rende inntekt.
\u2022 Forsiktighets- og sikringsprinsippet.

Vare levert 20.12 for 100 000 eks. mva, betales 10.01:
Debet Kundefordringer 125 000
   Kredit Salgsinntekt 100 000
   Kredit Utg\xE5ende mva 25 000 (f\xF8res i desember)`,`Eksamensdybde:
\u2022 De grunnleggende prinsippene kan bare fravikes i s\xE6rlige tilfeller n\xE5r det gir et bedre bilde, og det skal opplyses i noter.
\u2022 God regnskapsskikk (rskl \xA7 4-6) fyller ut prinsippene; NRS og IFRS 15 gir detaljregler for inntektsf\xF8ring.
\u2022 Tilvirkningskontrakter kan inntektsf\xF8res etter fullf\xF8ringsgrad n\xE5r utfallet kan m\xE5les p\xE5litelig.

Vanlige feil: \xE5 f\xF8re inntekt ved fakturering eller betaling i stedet for levering, og \xE5 kostnadsf\xF8re varekj\xF8p ved innkj\xF8p.`],["transaksjonsprinsippet","opptjeningsprinsippet","sammenstillingsprinsippet","forsiktighetsprinsippet","god regnskapsskikk"],["Regnskapsloven \xA7 4-1","NRS"],[["lett","N\xE5r skal en salgsinntekt normalt resultatf\xF8res etter opptjeningsprinsippet?",["Ved levering, n\xE5r risiko og kontroll er overf\xF8rt","N\xE5r fakturaen sendes","N\xE5r kunden betaler","N\xE5r bestillingen mottas"],"Inntekten er opptjent n\xE5r selger har levert og risiko og kontroll er g\xE5tt over til kj\xF8per."],["medium","Varer kj\xF8pt i november for 80 000 selges i januar. N\xE5r f\xF8res varekostnaden?",["I januar, sammen med salgsinntekten","I november ved kj\xF8pet","Halvparten i hver m\xE5ned","N\xE5r leverand\xF8ren betales"],"Sammenstillingsprinsippet: kostnaden f\xF8lger inntekten. Fram til salget st\xE5r varene som varelager i balansen."],["hard","Et selskap f\xE5r 60 000 i forskudd 1.11 for et 6-m\xE5neders abonnement. Hvor mye er inntekt per 31.12?",["20 000","60 000","0","10 000"],"2 av 6 m\xE5neder er opptjent: 60 000 \xD7 2/6 = 20 000. Resten, 40 000, er forskudd fra kunder (gjeld)."]],{mine:!0,own:"Foreleser: \xABOpptjening er det viktigste prinsippet p\xE5 eksamen\xBB. Husk risiko og kontroll!"}),j(ae,"Avskrivning av driftsmidler",5,"Line\xE6r avskrivning = (anskaffelse \u2013 utrangeringsverdi) / levetid. Maskin 500 000, 5 \xE5r, rest 50 000.","Notatet viser line\xE6r avskrivning av driftsmidler: anskaffelseskost minus utrangeringsverdi fordeles likt over den \xF8konomiske levetiden.",[`En maskin blir brukt opp over flere \xE5r. I stedet for \xE5 f\xF8re hele kostnaden det \xE5ret den kj\xF8pes, fordeler vi den over \xE5rene den brukes.

Maskin til 500 000 som varer i 5 \xE5r og kan selges for 50 000 til slutt: (500 000 \u2013 50 000) / 5 = 90 000 i kostnad hvert \xE5r.`,`Rskl \xA7 5-3: varige driftsmidler med begrenset levetid avskrives etter en fornuftig avskrivningsplan.

\xC5rlig avskrivning = (500 000 \u2013 50 000) / 5 = 90 000
Debet Avskrivning (resultat) 90 000
   Kredit Akkumulerte avskrivninger 90 000

Balansef\xF8rt verdi etter 2 \xE5r = 500 000 \u2013 180 000 = 320 000.`,`Eksamensdybde:
\u2022 Dekomponering: vesentlige deler med ulik levetid avskrives hver for seg (f.eks. tak og bygning).
\u2022 Endring av levetid eller restverdi er et estimatavvik \u2013 virkningen f\xF8res framover, ikke tilbake.
\u2022 Nedskrivning (rskl \xA7 5-3 tredje ledd) til virkelig verdi ved verdifall som ikke er forbig\xE5ende.
\u2022 Regnskapsmessig avskrivning er uavhengig av skattemessig saldoavskrivning \u2013 forskjellen gir utsatt skatt.`],["avskrivningsplan","utrangeringsverdi","\xF8konomisk levetid","balansef\xF8rt verdi","dekomponering"],["Regnskapsloven \xA7 5-3"],[["lett","Hva er \xE5rlig line\xE6r avskrivning for en maskin til 500 000 med 5 \xE5rs levetid og 50 000 i utrangeringsverdi?",["90 000","100 000","110 000","50 000"],"(500 000 \u2013 50 000) / 5 = 90 000."],["medium","Hva er balansef\xF8rt verdi av maskinen etter 3 \xE5r?",["230 000","320 000","270 000","200 000"],"500 000 \u2013 3 \xD7 90 000 = 230 000."],["hard","Etter 2 \xE5r settes gjenv\xE6rende levetid til 2 \xE5r (i stedet for 3). Utrangeringsverdien er uendret. Hva blir ny \xE5rlig avskrivning?",["135 000","90 000","160 000","115 000"],"Balansef\xF8rt verdi 320 000 \u2013 50 000 = 270 000 fordeles p\xE5 2 \xE5r = 135 000. Estimatendring f\xF8res framover."]]),j(ae,"Varelager \u2013 laveste verdis prinsipp",9,"Varer vurderes til laveste av anskaffelseskost og virkelig verdi (rskl 5-2). Netto salgsverdi = salgspris \u2013 salgskostnader. FIFO / gjennomsnitt.","Notatet forklarer at oml\xF8psmidler som varelager vurderes til laveste av anskaffelseskost og virkelig verdi, og hvordan FIFO og gjennomsnittsmetoden brukes.",[`Varelageret st\xE5r i balansen til det varene kostet. Men hvis varene n\xE5 kan selges for mindre enn de kostet, skal de skrives ned til det de faktisk er verdt.

Eksempel: jakker kj\xF8pt for 400 kr kan n\xE5 bare selges for 350 kr minus 20 kr i salgskostnader. Da st\xE5r de i regnskapet til 330 kr.`,`Rskl \xA7 5-2: oml\xF8psmidler vurderes til laveste av anskaffelseskost og virkelig verdi.
Virkelig verdi for varer = netto salgsverdi (forventet salgspris \u2013 salgskostnader).

Tilordning av kost:
\u2022 FIFO: f\xF8rst inn, f\xF8rst ut.
\u2022 Veid gjennomsnitt.
LIFO er ikke tillatt etter god regnskapsskikk.

Nedskrivning 100 jakker \xD7 (400 \u2013 330) = 7 000:
Debet Varekostnad 7 000 / Kredit Varelager 7 000`,`Eksamensdybde:
\u2022 Vurderingen gj\xF8res normalt per vare eller grupper av like varer, ikke for lageret samlet.
\u2022 Tilvirkede varer: anskaffelseskost inkluderer indirekte tilvirkningskostnader (full tilvirkningskost).
\u2022 Reversering: faller grunnen til nedskrivningen bort, skal den reverseres (NRS / IAS 2).
\u2022 Ukurans og svinn gir nedskrivning og inng\xE5r i varekostnaden.`],["laveste verdis prinsipp","netto salgsverdi","FIFO","veid gjennomsnitt","ukurans"],["Regnskapsloven \xA7 5-2","IAS 2"],[["lett","Hvordan vurderes varelager etter regnskapsloven?",["Laveste av anskaffelseskost og virkelig verdi","Alltid anskaffelseskost","Alltid virkelig verdi","H\xF8yeste av anskaffelseskost og salgspris"],"Rskl \xA7 5-2: laveste verdis prinsipp for oml\xF8psmidler."],["medium","Kostpris 400, forventet salgspris 350, salgskostnader 20. Hva blir verdien per enhet?",["330","350","400","370"],"Netto salgsverdi 350 \u2013 20 = 330 er lavere enn kost 400."],["hard","Inng\xE5ende lager 100 stk \xE0 50. Kj\xF8p 200 stk \xE0 56. Salg 220 stk. Hva er utg\xE5ende lager etter FIFO?",["4 480","4 320","4 000","4 640"],"Igjen er 80 stk, og etter FIFO er det de siste kj\xF8pte: 80 \xD7 56 = 4 480."]]),j(ae,"Utsatt skatt (22 %)",14,"Midlertidige forskjeller regnskap vs skatt. Driftsmiddel regnskap 300 000, skatt 200 000 -> forskjell 100 000 \xD7 22 % = 22 000 utsatt skatt. NRS 7.","Notatet forklarer hvordan midlertidige forskjeller mellom regnskapsmessige og skattemessige verdier gir utsatt skatt eller utsatt skattefordel med 22 % skattesats.",[`Skatteregler og regnskapsregler f\xF8rer noen ting i ulike \xE5r. Da betaler selskapet skatten et annet \xE5r enn regnskapet viser kostnaden.

Utsatt skatt er skatt selskapet ikke har betalt enn\xE5, men som kommer senere. Er maskinen verdt 300 000 i regnskapet og 200 000 skattemessig, er forskjellen 100 000. 22 % av det er 22 000 i utsatt skatt.`,`Utsatt skatt = (regnskapsmessig verdi \u2013 skattemessig verdi) \xD7 22 % for eiendeler.

Driftsmiddel: 300 000 \u2013 200 000 = 100 000 skatte\xF8kende forskjell \u2192 utsatt skatt 22 000 (gjeld).

Skattekostnad i resultatet = betalbar skatt + endring i utsatt skatt.

\xD8kning i utsatt skatt 22 000:
Debet Skattekostnad 22 000 / Kredit Utsatt skatt 22 000`,`Eksamensdybde:
\u2022 Permanente forskjeller (f.eks. 50 % av representasjon, ikke-fradragsberettigede kostnader) gir aldri utsatt skatt.
\u2022 Utsatt skattefordel balansef\xF8res bare n\xE5r det er sannsynlig at den kan utnyttes.
\u2022 Utsatt skatt og skattefordel innenfor samme tidsintervall kan nettes (NRS 7).
\u2022 Avstemming: effektiv skattesats avviker fra 22 % p\xE5 grunn av permanente forskjeller \u2013 avstemmingen er en vanlig eksamensoppgave.
\u2022 Sm\xE5 foretak kan unnlate utsatt skatt etter forenklede regler.`],["midlertidig forskjell","permanent forskjell","betalbar skatt","skattekostnad","utsatt skattefordel"],["NRS 7","IAS 12"],[["lett","Hva er skattesatsen for alminnelig inntekt for aksjeselskaper i Norge?",["22 %","25 %","28 %","18 %"],"Satsen for alminnelig inntekt er 22 %."],["medium","Regnskapsmessig verdi 300 000, skattemessig verdi 200 000. Hva er utsatt skatt?",["22 000","100 000","66 000","44 000"],"(300 000 \u2013 200 000) \xD7 22 % = 22 000."],["hard","Betalbar skatt er 150 000 og utsatt skatt \xF8ker fra 40 000 til 55 000. Hva er skattekostnaden i resultatet?",["165 000","150 000","135 000","205 000"],"Skattekostnad = betalbar skatt + endring i utsatt skatt = 150 000 + 15 000 = 165 000."]],{own:"Sp\xF8r i kollokviegruppa: hvorfor er representasjon en permanent forskjell?"}),j(ae,"Kontantstr\xF8moppstilling \u2013 indirekte metode",20,"Indirekte metode: resultat f\xF8r skatt + avskrivninger \u2013 betalt skatt \xB1 endring arbeidskapital. Tre deler: drift, investering, finansiering.","Notatet viser oppbyggingen av kontantstr\xF8moppstillingen etter indirekte metode med kontantstr\xF8m fra drift, investering og finansiering.",[`Resultatet viser om selskapet tjener penger, men ikke hvor mye penger som faktisk kom inn p\xE5 konto. Kontantstr\xF8moppstillingen viser det.

Vi starter med resultatet, legger til avskrivninger (de koster ikke kontanter), og justerer for endringer i lager, kunder og leverand\xF8rer.`,`Indirekte metode (NRS 2 / IAS 7):
Resultat f\xF8r skatt
\u2013 Betalt skatt
+ Avskrivninger og nedskrivninger
\u2013 \xD8kning i varelager / kundefordringer
+ \xD8kning i leverand\xF8rgjeld
= Netto kontantstr\xF8m fra drift

Investering: kj\xF8p og salg av driftsmidler og aksjer.
Finansiering: opptak og nedbetaling av l\xE5n, egenkapital, utbytte.`,`Eksamensdybde:
\u2022 Gevinst ved salg av driftsmiddel trekkes ut av driften; hele salgssummen vises under investering.
\u2022 Betalt utbytte er finansiering; mottatt renter og utbytte kan klassifiseres som drift eller investering, men konsekvent.
\u2022 Summen av de tre delene skal v\xE6re lik endringen i bankinnskudd og kontanter \u2013 en fin kontroll p\xE5 eksamen.`],["indirekte metode","arbeidskapital","kontantstr\xF8m fra drift","investeringsaktiviteter","finansieringsaktiviteter"],["NRS 2","IAS 7"],[["lett","Hvorfor legges avskrivninger til i indirekte metode?",["De er kostnader uten kontantutbetaling","De \xF8ker salgsinntektene","De er en finansieringsinntekt","De er en skattefri inntekt"],"Avskrivninger reduserer resultatet, men gir ingen utbetaling i perioden."],["medium","Kundefordringene \xF8ker med 40 000. Hvordan p\xE5virker det kontantstr\xF8m fra drift?",["Trekkes fra med 40 000","Legges til med 40 000","Ingen virkning","F\xF8res under finansiering"],"Mer av salget er ikke betalt enn\xE5, s\xE5 innbetalingene er lavere enn inntektene."],["hard","En maskin med bokf\xF8rt verdi 70 000 selges for 90 000. Hvordan vises dette?",["\u201320 000 under drift og +90 000 under investering","+20 000 under drift","+90 000 under drift","+70 000 under investering"],"Gevinsten 20 000 trekkes ut av driften; hele innbetalingen 90 000 er investeringsaktivitet."]]),j(ae,"Konsernregnskap \u2013 eliminering",34,"Morselskap eier 100 % av datter. Eliminer aksjer i datter mot EK i datter. Internt salg og interne fordringer/gjeld elimineres. Merverdi -> goodwill.","Notatet beskriver konsolidering: investeringen i datterselskapet elimineres mot egenkapitalen, og interne transaksjoner og mellomv\xE6render fjernes.",[`Et konsern er flere selskaper som eies av samme morselskap. Konsernregnskapet viser dem som om de var ett selskap.

Derfor fjerner vi alt som g\xE5r mellom selskapene: salg til hverandre, gjeld til hverandre og morens eierandel i datteren.`,`Elimineringer (rskl kap. 3 / NRS 17, IFRS 10):
1. Aksjer i datter mot egenkapital i datter p\xE5 kj\xF8pstidspunktet; overskytende fordeles p\xE5 merverdier og goodwill.
2. Interne fordringer mot intern gjeld.
3. Internt salg mot interne kj\xF8p.
4. Urealisert internfortjeneste i varelager.

Eksempel: kostpris aksjer 900, EK datter 700, merverdi tomt 120 \u2192 goodwill 80.`,`Eksamensdybde:
\u2022 Minoritetsinteresser (ikke-kontrollerende eierinteresser) vises som egen post i egenkapitalen.
\u2022 Merverdier avskrives i konsernet over eiendelens levetid; goodwill avskrives etter NRS, men nedskrivningstestes \xE5rlig etter IFRS.
\u2022 Utsatt skatt p\xE5 merverdier (ikke p\xE5 goodwill).

\u2022 Totalvesentlighet: vanlige referanser er 5 % av resultat f\xF8r skatt, 0,5\u20131 % av omsetning eller 1\u20132 % av totale eiendeler.
\u2022 Arbeidsvesentlighet: lavere enn totalvesentlighet (typisk 50\u201375 %) for \xE5 ta h\xF8yde for uoppdagede feil.

\u2022 Vesentlighet er b\xE5de kvantitativ og kvalitativ: sm\xE5 feil kan v\xE6re vesentlige (f.eks. n\xE6rst\xE5ende parter, brudd p\xE5 l\xE5nevilk\xE5r, misligheter).
\u2022 Revisor revurderer vesentlighet underveis hvis ny informasjon kommer.

Er n\xE5verdien av alt du f\xE5r inn st\xF8rre enn det du investerer, er prosjektet l\xF8nnsomt.`,`NPV = \u20131 000 000 + 300 000 \xD7 annuitetsfaktor(10 %, 5 \xE5r)

\u2022 Gjensidig utelukkende prosjekter med ulik levetid: bruk annuitetsmetoden.`],["n\xE5verdi","avkastningskrav","annuitetsfaktor","inkrementelle kontantstr\xF8mmer"],[],[["lett","N\xE5r er et prosjekt l\xF8nnsomt etter n\xE5verdimetoden?",["N\xE5r NPV > 0","N\xE5r NPV < 0","N\xE5r tilbakebetalingstiden er over 5 \xE5r","N\xE5r kontantstr\xF8mmene er like store hvert \xE5r"],"Positiv n\xE5verdi betyr at prosjektet gir mer enn avkastningskravet."],["medium","Hva er n\xE5verdien av 110 000 om ett \xE5r med 10 % avkastningskrav?",["100 000","110 000","99 000","121 000"],"110 000 / 1,10 = 100 000."],["hard","Investering 1 000 000, 300 000 per \xE5r i 5 \xE5r, r = 10 % (annuitetsfaktor 3,791). Hva er NPV?",["Ca. 137 000","Ca. 500 000","Ca. \u2013137 000","Ca. 300 000"],"300 000 \xD7 3,791 \u2013 1 000 000 \u2248 137 300."]],{mine:!0}),j(Ge,"Internrentemetoden",16,"IRR = renten som gir NPV = 0. Sammenlign med avskrivningskrav. Problem: flere IRR ved fortegnsskifte, rangering av prosjekter.","Notatet forklarer internrenten som den renten som gj\xF8r n\xE5verdien lik null, og svakhetene ved metoden.",["Internrenten er den \xABrenten\xBB prosjektet selv gir. Er den h\xF8yere enn det du krever, er prosjektet l\xF8nnsomt.",`Finn IRR ved pr\xF8ving eller interpolering:

\u2022 Generalforsamlingen: velger styret, godkjenner \xE5rsregnskapet, vedtar utbytte og vedtektsendringer.
\u2022 Styret (\xA7 6-12/6-13): forvaltning, planer og budsjetter, tilsyn med daglig leder, forsvarlig organisering av regnskap og formuesforvaltning.
\u2022 Daglig leder (\xA7 6-14): den daglige ledelsen; saker av uvanlig art eller stor betydning h\xF8rer til styret.`,`Eksamensdybde:

If you produce more than you sell, some fixed cost stays in the closing inventory under absorption costing, so profit looks higher.`,`Example: production 10,000 units, sales 8,000 units. Fixed production overhead TZS 40,000,000 \u2192 OAR TZS 4,000 per unit.
Inventory increase 2,000 units \xD7 4,000 = TZS 8,000,000.
Absorption profit = marginal profit + 8,000,000.

Rule: inventory \u2191 \u2192 absorption profit higher; inventory \u2193 \u2192 marginal profit higher; no change \u2192 same profit.`,`Exam depth:
\u2022 IAS 2 requires absorption costing (fixed production overhead based on normal capacity) for external reporting.
\u2022 Under/over-absorption: actual overhead vs absorbed overhead goes to the income statement.
\u2022 Marginal costing is better for short-term decisions (CVP, special orders, limiting factors) because it shows contribution.
\u2022 Reconciliation statement: marginal profit + (closing \u2013 opening inventory units) \xD7 fixed OAR = absorption profit.`],["contribution","fixed overhead absorption rate","period cost","under-absorption","inventory valuation"],["IAS 2"],[["lett","Under marginal costing, fixed production overhead is treated as\u2026",["A period cost","Part of the unit cost of inventory","A liability","A capital expense"],"Marginal costing charges all fixed costs to the period in which they occur."],["medium","Production 10,000 units, sales 8,000 units, fixed OAR TZS 4,000. How much higher is absorption profit?",["TZS 8,000,000","TZS 40,000,000","TZS 32,000,000","TZS 4,000,000"],"2,000 units increase in inventory \xD7 4,000 = 8,000,000."],["hard","Opening inventory 3,000 units, closing inventory 1,000 units, fixed OAR TZS 2,500. Marginal profit TZS 20m. What is absorption profit?",["TZS 15m","TZS 25m","TZS 20m","TZS 17.5m"],"Inventory falls by 2,000 units: 20m \u2013 2,000 \xD7 2,500 = 15m."]],{mine:!0,own:"Lecturer said this comes every year in the UE (2 marks for the reconciliation statement)."}),j(_e,"Cost-volume-profit (CVP) analysis",4,"Break-even units = fixed costs / contribution per unit. C/S ratio. Margin of safety. Selling price 25,000, VC 15,000, FC 60m.","The note shows CVP analysis: contribution per unit, contribution-to-sales ratio, break-even point and margin of safety.",[`Every item you sell gives you some money left after paying its variable cost. That is contribution. You need enough contribution to cover fixed costs before you make a profit.

Price 25,000 \u2013 variable cost 15,000 = 10,000 contribution per unit.`,`Contribution per unit = 25,000 \u2013 15,000 = TZS 10,000
C/S ratio = 10,000 / 25,000 = 40%
Break-even units = 60,000,000 / 10,000 = 6,000 units
Break-even revenue = 60,000,000 / 0.40 = TZS 150,000,000
Target profit 20m \u2192 (60m + 20m) / 10,000 = 8,000 units`,`Exam depth:
\u2022 Multi-product CVP uses the weighted average contribution per unit or C/S ratio based on the sales mix.
\u2022 Limitations: linear costs and revenue, constant sales mix, production = sales.
\u2022 Operating gearing: high fixed costs \u2192 profit more sensitive to volume.
\u2022 Break-even charts and profit-volume charts are common short questions.`],["contribution","C/S ratio","break-even point","margin of safety","target profit"],[],[["lett","Break-even point in units is\u2026",["Fixed costs \xF7 contribution per unit","Fixed costs \xF7 selling price","Variable cost \xF7 contribution","Sales \xF7 fixed costs"],"At break-even, total contribution equals fixed costs."],["medium","Price 25,000, variable cost 15,000, fixed costs 60m. What is break-even revenue?",["TZS 150m","TZS 100m","TZS 60m","TZS 240m"],"C/S ratio 40%: 60m \xF7 0.4 = 150m."],["hard","Budgeted sales are 7,500 units and break-even is 6,000 units. What is the margin of safety as a % of budgeted sales?",["20%","25%","80%","15%"],"(7,500 \u2013 6,000) \xF7 7,500 = 20%."]]),j(_e,"Standard costing \u2013 material variances",8,"Material price variance = (SP \u2013 AP) \xD7 AQ. Usage variance = (SQ \u2013 AQ) \xD7 SP. Std 2 kg @ 3,000; actual 21,000 kg @ 2,900 for 10,000 units.","The note explains how to calculate the material price and usage variances and how to interpret them.",[`A standard is what something should cost. A variance is the difference between what it should have cost and what it really cost.

If you paid less per kg than planned, the price variance is favourable. If you used more kg than planned, the usage variance is adverse.`,`Standard: 2 kg \xD7 TZS 3,000 per unit. Output 10,000 units \u2192 SQ 20,000 kg.
Actual: 21,000 kg at TZS 2,900.
Price variance = (3,000 \u2013 2,900) \xD7 21,000 = TZS 2,100,000 (F)
Usage variance = (20,000 \u2013 21,000) \xD7 3,000 = TZS 3,000,000 (A)
Total material variance = 900,000 (A)`,`Exam depth:
\u2022 Variances are interdependent: cheaper, poorer-quality material can cause an adverse usage variance.
\u2022 Price variance can be calculated on purchase or on usage \u2013 be consistent.
\u2022 Mix and yield variances split usage when several materials are used.
\u2022 Planning vs operational variances separate unrealistic standards from real performance.`],["standard cost","price variance","usage variance","favourable","adverse"],[],[["lett","The material price variance is calculated as\u2026",["(Standard price \u2013 actual price) \xD7 actual quantity","(Standard qty \u2013 actual qty) \xD7 standard price","Actual cost \u2013 budgeted sales","(Actual price \u2013 standard price) \xD7 standard qty"],"Price variance uses the actual quantity bought or used."],["medium","Standard 20,000 kg, actual 21,000 kg, standard price TZS 3,000. What is the usage variance?",["TZS 3,000,000 adverse","TZS 3,000,000 favourable","TZS 2,100,000 favourable","TZS 900,000 adverse"],"(20,000 \u2013 21,000) \xD7 3,000 = \u20133,000,000 \u2192 adverse."],["hard","A favourable price variance together with an adverse usage variance most likely means\u2026",["Cheaper, lower-quality material was bought","Workers were more efficient","The standard was too loose for both","Selling prices increased"],"Cheaper material often causes more waste."]],{mine:!0}),j(_e,"Flexible budgets",13,"Fixed budget compares actual with original volume \u2013 misleading. Flexible budget = budget restated to actual output. Variable costs flex, fixed don't.","The note explains why a flexible budget, adjusted to the actual level of activity, gives a fair comparison with actual results.",[`If you planned to make 1,000 units but made 1,200, of course you spent more on materials. Comparing with the original plan is unfair.

\u2022 Flexible budgets are the base for variance analysis in standard costing.
\u2022 Behavioural aspects: participation and realistic targets.`],["flexible budget","fixed budget","high\u2013low method","semi-variable cost"],[],[["lett","In a flexible budget, which costs change with output?",["Variable costs","Fixed costs","No costs","Only salaries"],"Variable costs are flexed to the actual level of activity."],["medium","Variable cost TZS 5,000 per unit, fixed costs TZS 2m, actual output 1,200 units. What is the flexible budget cost?",["TZS 8m","TZS 7m","TZS 6m","TZS 8.3m"],"1,200 \xD7 5,000 + 2m = 8m."],["hard","Using the high\u2013low method: 2,000 units cost TZS 9m and 3,000 units cost TZS 12m. What is the fixed cost?",["TZS 3m","TZS 6m","TZS 9m","TZS 1.5m"],"VC = 3m \xF7 1,000 = 3,000 per unit. Fixed = 9m \u2013 2,000 \xD7 3,000 = 3m."]]),j(_e,"Relevant costing \u2013 make or buy",19,"Relevant costs = future, incremental cash flows. Ignore sunk costs and allocated fixed overhead. Make: VC 12,000 + specific FC; buy: 14,000.","The note covers relevant costing for decisions such as make-or-buy, focusing on future incremental cash flows.",[`When you decide whether to make a part yourself or buy it, only count the costs that will actually change because of your decision.

Money already spent (sunk costs) and shared costs that stay the same anyway do not matter.`,`Make: variable cost TZS 12,000 per unit + specific supervisor TZS 6,000,000 per year. Buy: TZS 14,000 per unit. Need 5,000 units.

\u2192 Make saves TZS 4,000,000 (allocated factory overhead is ignored).`,`Exam depth:
\u2022 Opportunity cost: if capacity could be used for something else, add the lost contribution to the cost of making.
\u2022 Limiting factor: rank products by contribution per unit of the scarce resource.
\u2022 Qualitative factors: quality, supplier reliability, confidentiality, staff.
\u2022 Materials already in inventory: relevant cost = replacement cost if used regularly, otherwise the higher of resale value and alternative use.`],["relevant cost","sunk cost","opportunity cost","incremental cost","limiting factor"],[],[["lett","Which cost is NOT relevant to a decision?",["A sunk cost","An incremental cost","An opportunity cost","A future cash cost"],"Sunk costs have already been incurred and do not change."],["medium","Make costs TZS 66m and buying costs TZS 70m. Which is cheaper and by how much?",["Make, by TZS 4m","Buy, by TZS 4m","Equal","Make, by TZS 14m"],"70m \u2013 66m = 4m in favour of making."],["hard","If the company makes the part, it loses a contract with contribution TZS 6m. What is the decision now?",["Buy \u2013 making now costs TZS 72m","Make \u2013 still cheaper","Indifferent","Make \u2013 opportunity costs are ignored"],"66m + 6m opportunity cost = 72m > 70m."]]),j(ge,"IAS 2 \u2013 Inventories and NRV",3,"IAS 2: lower of cost and NRV. NRV = estimated selling price \u2013 costs to complete \u2013 costs to sell. FIFO / weighted average. LIFO not allowed.","The note explains IAS 2: inventories are measured at the lower of cost and net realisable value, using FIFO or weighted average cost.",[`Inventory is shown at what it cost. But if the goods can now only be sold for less, you must reduce the value to what you can get for them.

Example: shoes cost TZS 30,000, but you can only sell them for 28,000 and must pay 2,000 to sell them. Value: 26,000.`,`IAS 2.9: lower of cost and NRV, item by item.
Cost includes purchase price, import duties, transport and conversion costs (incl. fixed production overhead on normal capacity).
Excluded: abnormal waste, storage (unless needed in production), selling costs.

Write-down 500 pairs \xD7 (30,000 \u2013 26,000) = 2,000,000:
Dr Cost of sales 2,000,000 / Cr Inventory 2,000,000`,`Exam depth:
\u2022 Write-downs are reversed if NRV recovers (but not above original cost).

le sales, deducts input VAT paid on business purchases, and pays the difference to TRA in the monthly VAT return.",enkel:`VAT is a tax on what people buy. When a shop sells something for TZS 100,000, it adds 18% VAT (TZS 18,000) and the customer pays TZS 118,000.

The shop also paid VAT when it bought its goods. It can subtract that VAT from the VAT it collected, and only pays the difference to TRA.

   Cr Sales revenue 2,000,000

   Cr Trade payables 1,416,000

\u2022 Revenue under IFRS 15 is measured net of VAT because VAT is collected on behalf of TRA.

000","TZS 4,838,000","TZS 5,000,000 plus a VAT receivable of 900,000"],0,"An exempt trader cannot claim input VAT, so the VAT is irrecoverable and is included in the cost of the asset (IAS 16.16).",["Correct \u2013 irrecoverable VAT is part of cost.","Only correct if the input VAT were creditable.","Wrong calculation (18% deducted from gross).","An exempt trader has no right to reclaim the VAT."]),F("hard","Which journal entry records a credit sale of TZS 2,000,000 (net) by a VAT-registered trader?",["Dr Receivables 2,360,000 / Cr Sales 2,000,000 / Cr VAT payable 360,000","Dr Receivables 2,360,000 / Cr Sales 2,360,000","Dr Receivables 2,000,000 / Cr Sales 2,000,000 and Dr VAT expense 360,000","Dr Receivables 2,360,000 / Cr Sales 2,000,000 / Cr VAT receivable 360,000"],0,"Revenue excludes VAT (collected for TRA); the VAT is a liability until paid.",["Correct.","Revenue would be overstated by the VAT.","VAT is not an expense for a registered trader.","Output VAT is a liability (payable), not an asset."])]},ias16:{match:/\b(ias ?16|revalu|revaluation|fair value|ppe|property, plant)\b/i,subject:"Financial Accounting & IFRS",topic:"IAS 16 \u2013 Revaluation model",key_terms:["revalued amount","fair value","revaluation surplus","OCI","sufficient regularity","entire class"],standards:["IAS 16","IFRS 13","IAS 36"],calc_hints:{currency:!1,vat:!1,amounts:[]},summary:"The note covers the IAS 16 revaluation model: the revalued amount is the asset\u2019s fair value at the revaluation date, and revaluations must be made with sufficient regularity so the carrying amount does not differ materially from fair value.",enkel:`Normally a building is shown at what it cost, minus depreciation. With the revaluation model the company instead shows it at what it is worth today (fair value).

Increase (first revaluation), building carrying amount 400m, fair value 520m:
Dr Property, plant & equipment 120m
   Cr Revaluation surplus (OCI) 120m

Rules:
\u2022 Revalue with sufficient regularity (IAS 16.34) \u2013 yearly for volatile values, every 3\u20135 years for stable ones.
\u2022 If one item is revalued, the entire class must be revalued (IAS 16.36).

\u2022 Reversals: an increase that reverses a previous decrease recognised in P&L goes to P&L up to that amount; the rest to OCI (IAS 16.39).

\u2022 Accumulated depreciation at revaluation: either restated proportionately or eliminated against the gross amount (IAS 16.35).
\u2022 Deferred tax (IAS 12) arises on the surplus and is recognised in OCI.
\u2022 Disclosures (IAS 16.77): effective date, independent valuer, IFRS 13 level, carrying amount under the cost model, and movements in the surplus.

Pitfalls: crediting the surplus to P&L, revaluing only selected assets in a class, forgetting the deferred tax, and recycling the surplus through P&L on disposal (it is transferred directly to retained earnings).`,questions:[F("lett","Under the IAS 16 revaluation model, the revalued amount is\u2026",["Fair value at the revaluation date less subsequent depreciation and impairment","Historical cost less depreciation","Replacement cost of a new asset","The insured value"],0,"IAS 16.31 defines carrying amount under the revaluation model as fair value at the date of revaluation less subsequent accumulated depreciation and impairment losses.",["Correct.","That is the cost model.","Not the IAS 16 definition.","Insurance value is not fair value."]),F("lett","How often must revaluations be made under IAS 16?",["With sufficient regularity so carrying amount does not differ materially from fair value","Every year without exception","Every 5 years","Only when an impairment occurs"],0,"IAS 16.34 requires sufficient regularity; frequency depends on how volatile fair values are.",["Correct.","Annual revaluation is only needed if values are volatile.","There is no fixed 5-year rule.","Impairment is IAS 36, not the revaluation trigger."]),F("medium","A building with carrying amount TZS 400m is revalued for the first time to TZS 520m. Which entry is correct?",["Dr PPE 120m / Cr Revaluation surplus (OCI) 120m","Dr PPE 120m / Cr Profit or loss 120m","Dr PPE 520m / Cr Revaluation surplus 520m","Dr PPE 120m / Cr Retained earnings 120m"],0,"A first-time increase is recognised in OCI and accumulated in equity as revaluation surplus (IAS 16.39).",["Correct.","Increases go to OCI, not P&L (unless reversing a previous loss).","Only the increase is recorded, not the full value.","Retained earnings are not credited directly."]),F("medium","A company revalues one of its office buildings. What must it do with its other office buildings?",["Revalue the entire class of office buildings","Nothing \u2013 each asset is chosen separately","Revalue all PPE including vehicles","Disclose them at fair value without changing the books"],0,"IAS 16.36: if an item is revalued, the entire class to which it belongs must be revalued, to avoid selective revaluation.",["Correct.","Selective revaluation is not allowed.","Only the same class, not all PPE.","The class must be measured at revalued amounts."]),F("hard","An asset was previously revalued downwards by TZS 30m (recognised in P&L). It is now revalued upwards by TZS 50m. How is the increase recognised?",["TZS 30m in P&L and TZS 20m in OCI","TZS 50m in OCI","TZS 50m in P&L","TZS 20m in P&L and TZS 30m in OCI"],0,"An increase that reverses a previous decrease recognised in P&L is credited to P&L to that extent; the remainder goes to OCI (IAS 16.39).",["Correct.","Ignores the earlier loss in P&L.","Only the reversal part goes to P&L.","Amounts are swapped."]),F("hard","After revaluation, annual depreciation is TZS 30m; depreciation on historical cost would have been TZS 20m. What may the company do with the TZS 10m difference?",["Transfer it from revaluation surplus to retained earnings (Dr Surplus / Cr Retained earnings)","Credit it to profit or loss","Dr Retained earnings / Cr Revaluation surplus","Nothing \u2013 depreciation stays at TZS 20m"],0,"IAS 16.41 permits a reserve transfer of the excess depreciation directly within equity; it never passes through P&L.",["Correct.","The transfer is not made through P&L.","Wrong direction.","Depreciation must be based on the revalued amount."])]},ias21:{match:/\b(ias ?21|foreign currency|exchange|forex|usd|dollar|gbp|eur|valuta)\b/i,subject:"Financial Accounting & IFRS",topic:"IAS 21 \u2013 Foreign currency transactions",key_terms:["functional currency","spot rate","closing rate","monetary item","exchange difference"],standards:["IAS 21"],calc_hints:{currency:!0,vat:!1,amounts:[{amount:1e4,currency:"USD"}]},summary:"The note deals with recording foreign-currency transactions in Example: goods bought on credit for USD 10,000 at 2,600 = TZS 26,000,000.

Dr Exchange loss (P&L) 500,000 / Cr Payables 500,000`,svaert_avansert:`Exam depth:
\u2022 Exchange differences on monetary items go to P&L (IAS 21.28), except on a net investment in a foreign operation (OCI in consolidated statements).
\u2022 Non-monetary items at fair value use the rate at the date fair value was measured; any gain follows where the fair value change goes (P&L or OCI).
\u2022 Inventory bought in foreign currency stays at the historical rate, but the NRV test (IAS 2) uses the closing rate.
\u2022 Functional currency (IAS 21.9) is decided by the primary economic environment \u2013 currency of sales prices, costs and financing \u2013 not simply the currency of the reporting country.
\u2022 Translation of a foreign operation for consolidation: assets/liabilities at closing rate, income/expenses at transaction (or average) rates, differences to OCI (translation reserve).

t at 1 January 2025 and prepare the journal entries for the revaluation on that date.",solution:`Depreciation 2020\u20132024: 800 \xF7 40 = 20m \xD7 5 years = 100m
