<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyNotes demo</title>
  <meta name="description" content="Study notes, explanations and quizzes for Bachelor of Accounting (Tanzania)">
  <meta name="theme-color" content="#0f5f57">
  
  <!-- iPhone / Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StudyNotes">
  
  
  <meta name="format-detection" content="telephone=no">
  <style>[hidden] { display: none !important; }
:root {
  --bg: #f4f6f5; --card: #ffffff; --text: #17201e; --muted: #5d6b67; --line: #dfe5e3;
  --brand: #0f5f57; --brand-2: #e7f2f0; --ok: #16794c; --ok-bg: #e5f5ec; --bad: #b3261e; --bad-bg: #fbeaea;
  --warn: #9a6500; --warn-bg: #fff4dc; --radius: 14px; --tap: 44px;
  --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1413; --card: #182120; --text: #e6eeec; --muted: #9aaaa6; --line: #2a3533;
    --brand: #4fbfae; --brand-2: #1d3330; --ok: #5bd197; --ok-bg: #163126; --bad: #ff8a80; --bad-bg: #3a1c1a;
    --warn: #f0c36a; --warn-bg: #3a2f17; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--text); padding-bottom: calc(70px + var(--safe-bottom)); }
a { color: var(--brand); }
h1, h2, h3 { line-height: 1.25; margin: 0 0 .5rem; }
h2 { font-size: 1.25rem; } h3 { font-size: 1.05rem; }

/* Header */
.top { position: sticky; top: 0; z-index: 10; background: var(--brand); color: #fff;
  padding: calc(8px + var(--safe-top)) 14px 8px; box-shadow: 0 1px 6px rgba(0,0,0,.15); }
@media (prefers-color-scheme: dark) { .top { background: #10302c; } }
.top-row { display: flex; align-items: center; justify-content: space-between; }
.top h1 { font-size: 1.15rem; margin: 0; letter-spacing: .2px; }
.icon-btn { background: transparent; border: 0; font-size: 1.3rem; min-width: var(--tap); min-height: var(--tap); cursor: pointer; }
.status-row { display: flex; align-items: center; gap: 10px; font-size: .85rem; flex-wrap: wrap; min-height: 28px; }
.conn { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: #ccc; }
.dot.ok { background: #5be39a; } .dot.bad { background: #ff7b72; } .dot.warn { background: #ffd166; }
.queue-pill { background: rgba(255,255,255,.2); padding: 1px 9px; border-radius: 99px; font-weight: 600; }

.wrap { max-width: 760px; margin: 0 auto; padding: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }

/* Bunnfaner */
.tabs { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--card); border-top: 1px solid var(--line);
  padding-bottom: var(--safe-bottom); z-index: 10; }
.tabs a { flex: 1; text-align: center; text-decoration: none; color: var(--muted); padding: 7px 0 6px; font-size: .75rem; display: flex; flex-direction: column; align-items: center; }
.tabs a b { font-size: 1.25rem; line-height: 1.2; }
.tabs a.active { color: var(--brand); font-weight: 600; }

/* Skjema */
textarea, input, select { width: 100%; font: inherit; font-size: 16px; /* hindrer zoom på iOS */
  color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: var(--tap); }
textarea { resize: vertical; }
textarea:focus, input:focus, select:focus { outline: 2px solid var(--brand); outline-offset: 0; }
.field { display: block; margin: 0 0 10px; } .field > span { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 3px; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: var(--tap); padding: 0 16px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-weight: 600; cursor: pointer;
  -webkit-tap-highlight-color: transparent; position: relative; }
.btn.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
@media (prefers-color-scheme: dark) { .btn.primary { color: #06201c; } }
.btn.ghost { background: transparent; } .btn.danger { color: var(--bad); }
.btn.block { width: 100%; margin-top: 10px; } .btn.small { min-height: 36px; padding: 0 12px; font-size: .9rem; }
.btn.tiny { min-height: 28px; padding: 0 10px; font-size: .8rem; background: #fff; color: var(--brand); border: 0; }
.btn:disabled { opacity: .55; }
.row { display: flex; gap: 8px; align-items: center; margin: 10px 0; } .row.wrap { flex-wrap: wrap; } .row.end { justify-content: flex-end; }
.msg { padding: 10px 12px; border-radius: 10px; margin: 10px 0 0; font-size: .95rem; }
.msg:empty { display: none; }
.msg.ok { background: var(--ok-bg); color: var(--ok); } .msg.bad { background: var(--bad-bg); color: var(--bad); } .msg.warn { background: var(--warn-bg); color: var(--warn); }
.ok-text { color: var(--ok); } .bad-text { color: var(--bad); }
.muted { color: var(--muted); } .small { font-size: .82rem; } .center { text-align: center; } .pad { padding: 18px 0; } .big { font-size: 1.6rem; font-weight: 700; margin: 6px 0; }
.hint { font-size: .85rem; color: var(--muted); text-align: center; }
.pre { white-space: pre-wrap; word-wrap: break-word; }

.preview { display: flex; gap: 12px; align-items: center; margin-top: 8px; }
.preview img { width: 96px; height: 96px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
.noimg { width: 96px; height: 96px; display: grid; place-items: center; border-radius: 10px; background: var(--brand-2); font-size: .7rem; padding: 4px; text-align: center; word-break: break-all; }

.qlist { list-style: none; padding: 0; margin: 0; }
.qlist li { display: flex; gap: 6px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.qmain { flex: 1; min-width: 0; } .qmain > div:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Filtre */
.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0 10px; }

/* Notatkort */
.note-card { display: flex; gap: 12px; text-decoration: none; color: inherit; }
.note-card .thumb { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; flex: none; background: var(--brand-2); }
.nc-body { flex: 1; min-width: 0; }
.nc-top { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 4px; }
.note-card h3 { margin: 2px 0; }
.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin: 2px 0; font-size: .9rem; }
.tag { font-size: .72rem; background: var(--brand-2); color: var(--brand); padding: 2px 8px; border-radius: 99px; font-weight: 600; }
.badge { font-size: .72rem; padding: 2px 8px; border-radius: 99px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
.badge.ok { background: var(--ok-bg); color: var(--ok); } .badge.bad { background: var(--bad-bg); color: var(--bad); } .badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.diff-lett { background: var(--ok-bg); color: var(--ok); } .badge.diff-medium { background: var(--warn-bg); color: var(--warn); } .badge.diff-hard { background: var(--bad-bg); color: var(--bad); }
.back { display: inline-block; margin: 2px 0 10px; text-decoration: none; font-weight: 600; min-height: 32px; }
.note-img { width: 100%; max-height: 420px; object-fit: contain; border-radius: 10px; background: var(--bg); margin: 8px 0; }
details { margin: 8px 0; } summary { cursor: pointer; font-weight: 600; color: var(--brand); min-height: 32px; }

/* Segmentkontroll (forklaringsnivå) */
.seg { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; margin-bottom: 10px; }
.seg button { flex: 1; border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 600; font-size: .9rem; min-height: 38px; border-radius: 9px; cursor: pointer; }
.seg button.active { background: var(--card); color: var(--brand); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.seg.small button { font-size: .82rem; min-height: 32px; }
.expl { line-height: 1.6; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
.chip { border: 1px solid var(--brand); color: var(--brand); background: transparent; border-radius: 99px; padding: 6px 12px; font: inherit; font-size: .85rem; cursor: pointer; min-height: 36px; }
.chip.active { background: var(--brand); color: #fff; }
.chip.static { border-color: var(--line); color: var(--text); min-height: 0; padding: 2px 10px; cursor: default; }
.small-gap { gap: 4px; }

/* MC-oppgaver */
.q { border-top: 1px solid var(--line); padding: 12px 0; }
.q:first-child { border-top: 0; }
.q-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.q-text { font-weight: 600; margin: 8px 0; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--text); font: inherit; cursor: pointer; min-height: var(--tap); -webkit-tap-highlight-color: transparent; }
.opt b { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); font-size: .8rem; }
.opt:disabled { cursor: default; opacity: 1; }
.opt.right { border-color: var(--ok); background: var(--ok-bg); } .opt.right b { background: var(--ok); color: #fff; border-color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); } .opt.wrong b { background: var(--bad); color: #fff; border-color: var(--bad); }
.feedback { margin-top: 10px; padding: 12px; border-radius: 10px; }
.feedback.ok { background: var(--ok-bg); } .feedback.bad { background: var(--bad-bg); }
.feedback .verdict { font-weight: 700; margin: 0 0 6px; }
.feedback.ok .verdict { color: var(--ok); } .feedback.bad .verdict { color: var(--bad); }
.oe { padding-left: 18px; margin: 6px 0 0; } .oe li { margin-bottom: 6px; }
.quiz-top { display: flex; justify-content: space-between; font-weight: 600; font-size: .9rem; }
.bar { height: 10px; background: var(--bg); border-radius: 99px; overflow: hidden; margin: 8px 0; border: 1px solid var(--line); }
.bar.thin { height: 5px; } .bar > div { height: 100%; background: var(--brand); transition: width .3s; }

/* Kalkulator */
.calc-block { padding: 10px 0; border-top: 1px solid var(--line); scroll-margin-top: 110px; transition: background .4s; border-radius: 8px; }
.calc-block:first-child { border-top: 0; }
.calc-block.flash { background: var(--brand-2); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 10px; }
@media (max-width: 420px) { .grid3 { grid-template-columns: 1fr 1fr; } }
.converter input { text-align: right; font-variant-numeric: tabular-nums; }
.rate-input { width: 110px; }
.chips .field { margin: 0; flex: 1; min-width: 110px; }
.result > div { display: flex; justify-content: space-between; padding: 4px 0; font-variant-numeric: tabular-nums; }
.result .total { border-top: 2px solid var(--line); margin-top: 4px; padding-top: 6px; font-size: 1.05rem; }
.result .total.neg b { color: var(--ok); }

/* Dialog og toast */
dialog { border: 0; border-radius: var(--radius); padding: 0; width: min(94vw, 460px); background: var(--card); color: var(--text); }
dialog::backdrop { background: rgba(0,0,0,.45); }
.dlg { padding: 18px; }
#toasts { position: fixed; left: 0; right: 0; bottom: calc(80px + var(--safe-bottom)); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 50; }
.toast { background: #222; color: #fff; padding: 10px 16px; border-radius: 10px; opacity: 0; transform: translateY(8px); transition: .25s; max-width: 90vw; }
.toast.show { opacity: 1; transform: none; } .toast.ok { background: var(--ok); } .toast.bad { background: var(--bad); }

.spin { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: sp 0.8s linear infinite; vertical-align: -1px; }
@keyframes sp { to { transform: rotate(360deg); } }

/* Tipsboks */
.tips { background: var(--brand-2); border-radius: 12px; padding: 8px 12px; margin: 0 0 12px; }
.tips summary { color: var(--brand); }
.tips h4 { margin: 8px 0 4px; font-size: .95rem; }
.tips ul { margin: 0; padding-left: 20px; font-size: .9rem; }
.tips li { margin-bottom: 4px; }
.tips-grid { display: grid; gap: 4px 16px; }
@media (min-width: 640px) { .tips-grid { grid-template-columns: 1fr 1fr; } }
.warn-text { color: var(--warn); margin: 4px 0; }

/* Spør notatene */
.ask-row { display: flex; gap: 8px; }
.ask-row input { flex: 1; }
.answer { background: var(--bg); border-radius: 10px; padding: 12px; margin: 8px 0; line-height: 1.6; }
.ask .badge { margin: 8px 0 0; }

/* Fremgang og eksamensoppgaver */
.check { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 12px; }
.check input { width: 22px; height: 22px; min-height: 0; margin-top: 2px; flex: none; }
.prog-row { margin: 10px 0; }
.prog-head { display: flex; justify-content: space-between; gap: 8px; font-size: .92rem; }
.prog-row .bar { margin: 4px 0; }
.diff-mini { display: flex; gap: 10px; font-size: .75rem; color: var(--muted); }
.exam .scenario { background: var(--bg); border-left: 3px solid var(--brand); padding: 10px 12px; border-radius: 6px; margin: 8px 0 12px; }
.exam .part { border-top: 1px solid var(--line); padding: 10px 0; }
.exam .solution { background: var(--bg); padding: 10px; border-radius: 8px; margin: 6px 0; font-size: .92rem; }
.btn.chosen { background: var(--brand); color: #fff; border-color: var(--brand); }
.btn.danger.chosen { background: var(--bad); border-color: var(--bad); color: #fff; }
.self-score { font-weight: 700; color: var(--brand); }
dialog { max-height: 92vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }

/* Nivå og feil */
.level { margin: 6px 0 2px; display: grid; gap: 4px; justify-items: start; }
.level .steps { display: grid; gap: 2px; color: var(--muted); }
.mist { border-top: 1px solid var(--line); padding: 10px 0; }
.mist:first-of-type { border-top: 0; }
.mopts { list-style: none; padding: 0; margin: 6px 0; display: grid; gap: 4px; }
.mopts li { padding: 6px 10px; border-radius: 8px; background: var(--bg); font-size: .92rem; }
.mopts li.right { background: var(--ok-bg); color: var(--ok); }
.mopts li.wrong { background: var(--bad-bg); color: var(--bad); }

/* Tilbakemelding */
.fb-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
.fb-row .btn.tiny { min-height: 32px; border: 1px solid var(--line); color: var(--text); background: transparent; }
.fb-form { display: flex; gap: 6px; flex: 1 1 100%; }
.fb-form input { min-height: 36px; padding: 6px 10px; }

/* Navn og neste steg */
.top-row { gap: 8px; }
.top-row h1 { flex: 1; }
.name-chip { background: rgba(255,255,255,.16); color: #fff; border: 0; border-radius: 99px; padding: 6px 12px;
  font: inherit; font-size: .85rem; font-weight: 600; max-width: 45vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 36px; }
.name-chip.empty { background: #fff; color: var(--brand); }
.name-card { border: 2px solid var(--brand); }
.next-card { border-left: 4px solid var(--brand); }
.next-list { margin: 6px 0; padding-left: 20px; display: grid; gap: 8px; }
.next-list li { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.next-list li span { flex: 1; }

/* AI-supplement og hull */
.tag.ai { background: #efe7ff; color: #5b34b5; }
@media (prefers-color-scheme: dark) { .tag.ai { background: #2c2147; color: #c9b5ff; } }
.ai-note { background: #f3eeff; border-left: 3px solid #7b54d6; padding: 8px 10px; border-radius: 6px; font-size: .88rem; }
@media (prefers-color-scheme: dark) { .ai-note { background: #231c36; } }
.gaps .gap { border-top: 1px solid var(--line); padding: 8px 0; }
.gaps .gap p { margin: 4px 0; }

/* Innlogging */
body.login-mode .tabs, body.login-mode #syncBtn { display: none; }
.login-card { max-width: 420px; margin: 24px auto; }
.account { background: var(--bg); border-radius: 10px; padding: 10px 12px; margin: 0 0 12px; }
.account p { margin: 0 0 6px; }

.check-row{display:flex;gap:.6rem;align-items:flex-start;margin:.4rem 0 .9rem;cursor:pointer}
.check-row input{width:1.3rem;height:1.3rem;margin-top:.1rem;flex:none}
body.login-mode #nameChip{display:none!important}
.period-bar { margin: 4px 0 10px; }
.period-bar .chip { min-height: 34px; padding: 5px 11px; }
.period-bar .cnt { opacity: .7; font-size: .8em; margin-left: 2px; }
details.when { margin: 8px 0 12px; }
details.when summary { cursor: pointer; font-size: .92rem; }
details.when .field, .when-edit .field { flex: 1; min-width: 130px; margin: 6px 0 0; }
.when-edit { align-items: flex-end; margin-bottom: 8px; }
.linkbtn { background: none; border: 0; color: var(--brand); font: inherit; text-decoration: underline; padding: 0 4px; cursor: pointer; }
details.sem-dates { margin: 10px 0; padding: 8px 10px; border: 1px solid var(--line, #ddd); border-radius: 12px; }
details.sem-dates summary { cursor: pointer; font-weight: 600; }
.sem-row { align-items: flex-end; gap: 8px; margin: 6px 0; }
.sem-row .sem-name { width: 100%; font-size: .9rem; }
.sem-row .field { flex: 1; min-width: 120px; margin: 0; }
.sem-row .field input, .when-edit .field input, details.when .field input { padding-left: 8px; padding-right: 6px; font-size: .95rem; min-width: 0; width: 100%; box-sizing: border-box; }
#fileBox .field { flex-basis: 100%; }
.chips.scroll-x { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 2px; }
.chips.scroll-x::-webkit-scrollbar { display: none; }
.chips.scroll-x .chip, .chips.scroll-x > span { flex: none; white-space: nowrap; }
.chip.mine { border-color: #b7791f; color: #8a5a12; }
.chip.mine.active { background: #b7791f; color: #fff; }
.chip.ghost { border-style: dashed; }
.chip.small { min-height: 30px; padding: 3px 10px; font-size: .8rem; }
.filebar { margin: 8px 0 10px; }
.filebar .fb-lbl { margin-bottom: 2px; }
#fileEdit .field { flex-basis: 100%; margin: 6px 0 0; }
.mytopics { margin: 0 0 8px; align-items: center; }
.tag.mine { background: #fdf1dc; color: #8a5a12; }
.tag.aitopic { background: #eef1f0; color: #5b6b66; font-weight: 500; }
.topic-origin { margin: -4px 0 6px; color: #8a5a12; }
@media (prefers-color-scheme: dark) {
  .tag.mine { background: #3a2c14; color: #f0c674; } .chip.mine { color: #f0c674; border-color: #c9952e; }
  .tag.aitopic { background: #26302d; color: #a9b8b3; } .topic-origin { color: #f0c674; }
}
.filter-box { margin: 4px 0 10px; }
.filter-box > summary { list-style: none; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.filter-box > summary::-webkit-details-marker { display: none; }
.filter-box[open] > summary { margin-bottom: 6px; }
.filter-box .linkbtn { margin-left: 8px; }
.badge-n { background: var(--brand); color: #fff; border-radius: 99px; padding: 0 7px; font-size: .75rem; }
.ask-sub { margin: -4px 0 8px; }
.transcript { margin: 10px 0; padding: 10px 12px; border: 1px solid var(--line, #d9e0dd); border-radius: 12px; }
.transcript .tr-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.transcript textarea { width: 100%; box-sizing: border-box; }
/* iPhone: et trykk på en knapp skal aldri markere tekst («Copy / Look Up»-menyen) */
button, .btn, .chip, summary, nav a { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.up-prog { margin: 4px 0 8px; }
.up-prog .bar { height: 6px; background: var(--line, #d9e0dd); border-radius: 99px; overflow: hidden; margin-top: 4px; }
.up-prog .bar i { display: block; height: 100%; background: var(--brand); transition: width .3s; }
.qlist li { align-items: flex-start; }
.qrow { margin-top: 3px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.qstate.retry, .qstate.failed { color: #b45309; }
.qstate.done { color: var(--brand); font-weight: 600; }
.qbar { height: 5px; background: var(--line, #d9e0dd); border-radius: 99px; overflow: hidden; margin-top: 5px; max-width: 260px; }
.qbar i { display: block; height: 100%; width: 0; background: var(--brand); transition: width .35s; }
.qbar.done i { background: #22a06b; }
.qsum { font-weight: 400; margin-left: 6px; }
.qstate.offline { color: #6b7280; }

Ubenyttet skjerming fremf\xF8res til senere \xE5r p\xE5 samme aksje.`,`Eksamensdybde:

\u2022 Totalvesentlighet: vanlige referanser er 5 % av resultat f\xF8r skatt, 0,5\u20131 % av omsetning eller 1\u20132 % av totale eiendeler.
\u2022 Arbeidsvesentlighet: lavere enn totalvesentlighet (typisk 50\u201375 %) for \xE5 ta h\xF8yde for uoppdagede feil.
\u2022 Grense for ubetydelige feil: typisk ca. 5 % av totalvesentlighet.

Eksempel: resultat f\xF8r skatt 4 mill. \u2192 totalvesentlighet 200 000, arbeidsvesentlighet 150 000.`,`Eksamensdybde:
\u2022 Vesentlighet er b\xE5de kvantitativ og kvalitativ: sm\xE5 feil kan v\xE6re vesentlige (f.eks. n\xE6rst\xE5ende parter, brudd p\xE5 l\xE5nevilk\xE5r, misligheter).

Revisjonsrisiko (RR) = risiko for vesentlig feilinformasjon (iboende \xD7 kontrollrisiko) \xD7 oppdagelsesrisiko.

\u2022 Iboende risiko: hvor utsatt posten er for feil (skj\xF8nn, komplekse estimater).
\u2022 Kontrollrisiko: risiko for at selskapets kontroller ikke forhindrer eller oppdager feil.

\u2022 Revidert ISA 315 skiller mellom en rekke iboende risikofaktorer: kompleksitet, subjektivitet, endring, usikkerhet og tilb\xF8yelighet til skjevhet.`],["iboende risiko","kontrollrisiko","oppdagelsesrisiko","betydelig risiko","substanshandlinger"],["ISA 200","ISA 315","ISA 330"],[["lett","Hvilken del av revisjonsrisikoen kan revisor direkte styre?",["Oppdagelsesrisiko","Iboende risiko","Kontrollrisiko","Forretningsrisiko"],"Revisor styrer oppdagelsesrisikoen gjennom omfang og type handlinger."],["medium","Iboende risiko og kontrollrisiko er h\xF8ye. Hva gj\xF8r revisor?",["Senker akseptabel oppdagelsesrisiko og \xF8ker substanshandlingene","\xD8ker oppdagelsesrisikoen","Tester bare kontroller","Senker vesentligheten til null"],"H\xF8y risiko for vesentlig feil krever lav oppdagelsesrisiko."],["hard","Hvilken risiko skal revisor alltid anse som betydelig etter ISA 240?",["Ledelsens overstyring av kontroller","Feil i kontantbeholdning","Avrundingsfeil","Feil i noteopplysninger om ansatte"],"Ledelsens overstyring av kontroller er alltid en betydelig risiko."]]),P(qe,"Revisjonsberetning \u2013 konklusjoner",22,"ISA 700 normal beretning. ISA 705: konklusjon med forbehold, negativ konklusjon, konklusjon kan ikke gis. ISA 706: presisering av forhold.","Notatet gir oversikt over typer revisjonsberetning: normal (umodifisert), konklusjon med forbehold, negativ konklusjon og konklusjon kan ikke gis.",[`Revisjonsberetningen er revisors \xABkarakter\xBB p\xE5 regnskapet. De fleste f\xE5r en ren beretning: regnskapet gir et rettvisende bilde.

Er det feil eller mangler revisor ikke f\xE5r sjekket, sier revisor fra \u2013 mildt eller sterkt, avhengig av hvor stort og utbredt problemet er.`,`ISA 705 \u2013 modifisert konklusjon:

\u2022 Mangel p\xE5 bevis, gjennomgripende \u2192 konklusjon kan ikke gis.

ISA 706: presisering av forhold (f.eks. vesentlig usikkerhet) uten \xE5 modifisere konklusjonen. ISA 570 for fortsatt drift.`,`Eksamensdybde:
\u2022 Gjennomgripende = p\xE5virker mange poster eller er grunnleggende for forst\xE5elsen av regnskapet.
\u2022 Sentrale forhold ved revisjonen (ISA 701) er obligatorisk for b\xF8rsnoterte foretak.
\u2022 Vesentlig usikkerhet om fortsatt drift som er tilstrekkelig opplyst \u2192 eget avsnitt; ikke opplyst \u2192 modifisert konklusjon.`],["normal beretning","forbehold","negativ konklusjon","gjennomgripende","fortsatt drift"],["ISA 700","ISA 705","ISA 706","ISA 570"],[["lett","Hva betyr en normal (umodifisert) revisjonsberetning?",["Regnskapet gir et rettvisende bilde","Det finnes ingen feil overhodet","Revisor har kontrollert alle bilag","Selskapet g\xE5r med overskudd"],"Normal beretning: regnskapet gir i alle vesentlige henseender et rettvisende bilde."],["medium","En vesentlig feil i varelageret, ikke gjennomgripende, blir ikke rettet. Hvilken konklusjon?",["Konklusjon med forbehold","Negativ konklusjon","Normal beretning","Konklusjon kan ikke gis"],"Vesentlig, ikke gjennomgripende feil gir forbehold."],["hard","Revisor f\xE5r ikke tilgang til regnskapsmateriale for de fleste vesentlige poster. Hvilken konklusjon?",["Konklusjon kan ikke gis","Negativ konklusjon","Forbehold","Normal beretning med presisering"],"Mangel p\xE5 bevis som er gjennomgripende \u2192 konklusjon kan ikke gis."]]),P(qe,"Uavhengighet og revisorloven",50,"Revisor m\xE5 v\xE6re uavhengig og objektiv. Trusler: egeninteresse, egenkontroll, partsrepresentasjon, n\xE6rt forhold, press. Rotasjon for PIE.","Notatet g\xE5r gjennom revisors uavhengighet: trusler mot uavhengighet og tiltak, og s\xE6rregler for foretak av allmenn interesse.",["Revisor skal kontrollere regnskapet for samfunnet, ikke for \xE5 gj\xF8re selskapet forn\xF8yd. Derfor kan ikke revisor eie aksjer i selskapet, revidere sitt eget arbeid eller v\xE6re n\xE6r venn med daglig leder.",`Revisorloven kap. 8 og IESBA-reglene:

\u2022 Foretak av allmenn interesse (PIE): krav om rotasjon av oppdragsansvarlig revisor og begrensninger p\xE5 tilleggstjenester.
\u2022 Honoraravhengighet fra \xE9n klient er en egeninteressetrussel.
\u2022 Vurder trussel \u2192 betydning \u2192 tiltak; finnes ingen tilstrekkelige tiltak, m\xE5 oppdraget avsl\xE5s.`],["uavhengighet","egeninteresse","egenkontroll","rotasjon","foretak av allmenn interesse"],["Revisorloven","IESBA"],[["lett","Hvilken trussel oppst\xE5r n\xE5r revisor reviderer et regnskap hun selv har satt opp?",["Egenkontroll","Press","Partsrepresentasjon","N\xE6rt forhold"],"\xC5 kontrollere eget arbeid er en egenkontrolltrussel."],["medium","Revisor eier aksjer i klienten. Hvilken trussel er det?",["Egeninteresse","Egenkontroll","Press","Ingen trussel"],"\xD8konomisk interesse i klienten er en egeninteressetrussel."],["hard","Hva m\xE5 revisor gj\xF8re hvis en trussel ikke kan reduseres til et akseptabelt niv\xE5?",["Avsl\xE5 eller fratre oppdraget","Opplyse om det i beretningen","\xD8ke honoraret","Be styret godkjenne det"],"Uten tilstrekkelige tiltak kan ikke revisor p\xE5ta seg eller fortsette oppdraget."]],{plain:!0}),P(qe,"Internkontroll \u2013 COSO",75,"COSO-rammeverket: kontrollmilj\xF8, risikovurdering, kontrollaktiviteter, informasjon og kommunikasjon, overv\xE5king. Arbeidsdeling!","Notatet beskriver de fem komponentene i COSO-rammeverket for internkontroll og hvorfor revisor vurderer dem.",[`Internkontroll er rutinene et selskap bruker for \xE5 unng\xE5 feil og juks \u2013 for eksempel at den som bestiller varer ikke er den samme som betaler fakturaen.

1. Kontrollmilj\xF8 (ledelsens holdning, \xABtone at the top\xBB)
2. Risikovurdering
3. Kontrollaktiviteter (godkjenning, avstemming, arbeidsdeling, fysisk sikring)
4. Informasjon og kommunikasjon
5. Overv\xE5king

Revisor kartlegger internkontrollen (ISA 315) og kan teste kontroller for \xE5 redusere substanshandlinger.`,`Eksamensdybde:
\u2022 Iboende begrensninger: kontroller kan omg\xE5s ved samarbeid eller overstyres av ledelsen.
\u2022 Generelle IT-kontroller (tilgang, endringer, drift) er en forutsetning for \xE5 stole p\xE5 automatiske kontroller.
\u2022 Mangler i internkontrollen kommuniseres til ledelse og styre (ISA 265).`],["kontrollmilj\xF8","kontrollaktiviteter","arbeidsdeling","IT-kontroller","overv\xE5king"],["COSO","ISA 315","ISA 265"],[["lett","Hva er et eksempel p\xE5 arbeidsdeling?",["Den som bestiller varer godkjenner ikke betalingen","\xC9n person gj\xF8r alt for \xE5 spare tid","Alle har tilgang til bankkontoen","Daglig leder f\xF8rer regnskapet alene"],"Arbeidsdeling hindrer at \xE9n person b\xE5de kan gj\xF8re og skjule en feil."],["medium","Hvilken COSO-komponent gjelder ledelsens holdning til kontroll og etikk?",["Kontrollmilj\xF8","Overv\xE5king","Risikovurdering","Informasjon og kommunikasjon"],"Kontrollmilj\xF8et er grunnlaget (\xABtone at the top\xBB)."],["hard","Hvorfor kan ikke revisor stole fullt p\xE5 selv god internkontroll?",["Kontroller kan omg\xE5s ved samarbeid eller overstyres av ledelsen","ISA forbyr det","Kontroller er alltid manuelle","Fordi kontroller ikke dokumenteres"],"Internkontroll har iboende begrensninger."]]),P(jt,"Dekningsbidrag og nullpunkt",1,"DB = pris \u2013 variable kostnader per enhet. Nullpunkt = faste kostnader / DB per enhet. Pris 500, VEK 300, FK 400 000.","Notatet viser hvordan dekningsbidrag og nullpunktsomsetning beregnes, og hvordan sikkerhetsmarginen brukes.",[`Hver gang du selger en vare, f\xE5r du et bidrag som skal dekke de faste kostnadene (husleie, l\xF8nn). Det er dekningsbidraget.

Pris 500 minus variable kostnader 300 = 200 i dekningsbidrag. Har du 400 000 i faste kostnader, m\xE5 du selge 2 000 stk f\xF8r du g\xE5r i null.`,`DB per enhet = 500 \u2013 300 = 200
DG (dekningsgrad) = 200 / 500 = 40 %
Nullpunkt i mengde = 400 000 / 200 = 2 000 stk
Nullpunkt i kroner = 400 000 / 0,40 = 1 000 000
Sikkerhetsmargin ved salg 2 600 stk = (2 600 \u2013 2 000) / 2 600 \u2248 23 %`,`Eksamensdybde:
\u2022 Flere produkter: bruk vektet DB eller DG etter salgsmiks; nullpunktet endres n\xE5r miksen endres.
\u2022 Resultatm\xE5l: n\xF8dvendig mengde = (FK + \xF8nsket resultat) / DB.

If you produce more than you sell, some fixed cost stays in the closing inventory under absorption costing, so profit looks higher.`,`Example: production 10,000 units, sales 8,000 units. Fixed production overhead TZS 40,000,000 \u2192 OAR TZS 4,000 per unit.
Inventory increase 2,000 units \xD7 4,000 = TZS 8,000,000.
Absorption profit = marginal profit + 8,000,000.

Rule: inventory \u2191 \u2192 absorption profit higher; inventory \u2193 \u2192 marginal profit higher; no change \u2192 same profit.`,`Exam depth:

\u2022 Under/over-absorption: actual overhead vs absorbed overhead goes to the income statement.
\u2022 Marginal costing is better for short-term decisions (CVP, special orders, limiting factors) because it shows contribution.
\u2022 Reconciliation statement: marginal profit + (closing \u2013 opening inventory units) \xD7 fixed OAR = absorption profit.`],["contribution","fixed overhead absorption rate","period cost","under-absorption","inventory valuation"],["IAS 2"],[["lett","Under marginal costing, fixed production overhead is treated as\u2026",["A period cost","Part of the unit cost of inventory","A liability","A capital expense"],"Marginal costing charges all fixed costs to the period in which they occur."],["medium","Production 10,000 units, sales 8,000 units, fixed OAR TZS 4,000. How much higher is absorption profit?",["TZS 8,000,000","TZS 40,000,000","TZS 32,000,000","TZS 4,000,000"],"2,000 units increase in inventory \xD7 4,000 = 8,000,000."],["hard","Opening inventory 3,000 units, closing inventory 1,000 units, fixed OAR TZS 2,500. Marginal profit TZS 20m. What is absorption profit?",["TZS 15m","TZS 25m","TZS 20m","TZS 17.5m"],"Inventory falls by 2,000 units: 20m \u2013 2,000 \xD7 2,500 = 15m."]],{mine:!0,own:"Lecturer said this comes every year in the UE (2 marks for the reconciliation statement)."}),P(nt,"Cost-volume-profit (CVP) analysis",4,"Break-even units = fixed costs / contribution per unit. C/S ratio. Margin of safety. Selling price 25,000, VC 15,000, FC 60m.","The note shows CVP analysis: contribution per unit, contribution-to-sales ratio, break-even point and margin of safety.",[`Every item you sell gives you some money left after paying its variable cost. That is contribution. You need enough contribution to cover fixed costs before you make a profit.

Price 25,000 \u2013 variable cost 15,000 = 10,000 contribution per unit.`,`Contribution per unit = 25,000 \u2013 15,000 = TZS 10,000
C/S ratio = 10,000 / 25,000 = 40%
Break-even units = 60,000,000 / 10,000 = 6,000 units
Break-even revenue = 60,000,000 / 0.40 = TZS 150,000,000
Target profit 20m \u2192 (60m + 20m) / 10,000 = 8,000 units`,`Exam depth:
\u2022 Multi-product CVP uses the weighted average contribution per unit or C/S ratio based on the sales mix.
\u2022 Limitations: linear costs and revenue, constant sales mix, production = sales.
\u2022 Operating gearing: high fixed costs \u2192 profit more sensitive to volume.
\u2022 Break-even charts and profit-volume charts are common short questions.`],["contribution","C/S ratio","break-even point","margin of safety","target profit"],[],[["lett","Break-even point in units is\u2026",["Fixed costs \xF7 contribution per unit","Fixed costs \xF7 selling price","Variable cost \xF7 contribution","Sales \xF7 fixed costs"],"At break-even, total contribution equals fixed costs."],["medium","Price 25,000, variable cost 15,000, fixed costs 60m. What is break-even revenue?",["TZS 150m","TZS 100m","TZS 60m","TZS 240m"],"C/S ratio 40%: 60m \xF7 0.4 = 150m."],["hard","Budgeted sales are 7,500 units and break-even is 6,000 units. What is the margin of safety as a % of budgeted sales?",["20%","25%","80%","15%"],"(7,500 \u2013 6,000) \xF7 7,500 = 20%."]]),P(nt,"Standard costing \u2013 material variances",8,"Material price variance = (SP \u2013 AP) \xD7 AQ. Usage variance = (SQ \u2013 AQ) \xD7 SP. Std 2 kg @ 3,000; actual 21,000 kg @ 2,900 for 10,000 units.","The note explains how to calculate the material price and usage variances and how to interpret them.",[`A standard is what something should cost. A variance is the difference between what it should have cost and what it really cost.

If you paid less per kg than planned, the price variance is favourable. If you used more kg than planned, the usage variance is adverse.`,`Standard: 2 kg \xD7 TZS 3,000 per unit. Output 10,000 units \u2192 SQ 20,000 kg.
Actual: 21,000 kg at TZS 2,900.
Price variance = (3,000 \u2013 2,900) \xD7 21,000 = TZS 2,100,000 (F)
Usage variance = (20,000 \u2013 21,000) \xD7 3,000 = TZS 3,000,000 (A)

A flexible budget asks: what should it have cost for 1,200 units?`,`Budget: 1,000 units, variable cost TZS 5,000 per unit, fixed costs TZS 2,000,000.

Money already spent (sunk costs) and shared costs that stay the same anyway do not matter.`,`Make: variable cost TZS 12,000 per unit + specific supervisor TZS 6,000,000 per year. Buy: TZS 14,000 per unit. Need 5,000 units.
Make = 5,000 \xD7 12,000 + 6,000,000 = 66,000,000
Buy = 5,000 \xD7 14,000 = 70,000,000
\u2192 Make saves TZS 4,000,000 (allocated factory overhead is ignored).`,`Exam depth:

Example: shoes cost TZS 30,000, but you can only sell them for 28,000 and must pay 2,000 to sell them. Value: 26,000.`,`IAS 2.9: lower of cost and NRV, item by item.
Cost includes purchase price, import duties, transport and conversion costs (incl. fixed production overhead on normal capacity).

Write-down 500 pairs \xD7 (30,000 \u2013 26,000) = 2,000,000:
Dr Cost of sales 2,000,000 / Cr Inventory 2,000,000`,`Exam depth:
\u2022 Write-downs are reversed if NRV recovers (but not above original cost).

1. Present obligation (legal or constructive) from a past event
2. Probable outflow of resources

Dr Legal expenses 15,000,000 / Cr Provision 15,000,000`,`Exam depth:

Step 2: identify performance obligations (distinct goods/services).
Step 3: determine the transaction price.
Step 4: allocate based on stand-alone selling prices (SSP).
Step 5: recognise when (point in time) or as (over time) obligations are satisfied.

le sales, deducts input VAT paid on business purchases, and pays the difference to TRA in the monthly VAT return.",enkel:`VAT is a tax on what people buy. When a shop sells something for TZS 100,000, it adds 18% VAT (TZS 18,000) and the customer pays TZS 118,000.

\u2022 Irrecoverable VAT (e.g. on non-creditable items) is capitalised into cost under IAS 16/IAS 2.
\u2022 Revenue under IFRS 15 is measured net of VAT because VAT is collected on behalf of TRA.

Common pitfalls: computing 18% of a VAT-inclusive amount (correct is \xD718/118), forgetting that exempt traders cannot reclaim input VAT, and posting VAT to profit or loss. Check registration thresholds and filing deadlines against the current VAT Act and TRA guidance.`,questions:[G("lett","What is the standard VAT rate in mainland Tanzania?",["18%","15%","16%","20%"],0,"The standard rate under the VAT Act 2014 is 18%.",["Correct \u2013 the standard rate.","15% is not the Tanzanian standard rate.","16% is used in some other countries (e.g. Kenya), not Tanzania.","20% is not the Tanzanian rate."]),G("lett","Output VAT is\u2026",["VAT charged by a business on its taxable sales","VAT paid on purchases","A withholding tax on services","Tax on company profits"],0,"Output VAT is charged on taxable supplies (sales) and is owed to TRA.",["Correct.","That is input VAT.","Withholding tax is a different tax.","That is corporate income tax."]),G("medium","Goods are sold for TZS 1,180,000 including VAT at 18%. What is the output VAT?",["TZS 180,000","TZS 212,400","TZS 118,000","TZS 1,000,000"],0,"VAT-inclusive amount \xD7 18/118 = 1,180,000 \xD7 18/118 = 180,000. Net sale = 1,000,000.",["Correct: 1,180,000 \xD7 18/118.","This is 18% of the gross amount \u2013 the wrong base.","This is 10% of the gross amount.","This is the net sale, not the VAT."]),G("medium","In March a trader has standard-rated sales of TZS 10,000,000 (net) and creditable purchases of TZS 6,000,000 (net). What is payable to TRA?",["TZS 720,000","TZS 1,800,000","TZS 1,080,000","TZS 4,000,000"],0,"Output VAT 10,000,000 \xD7 18% = 1,800,000. Input VAT 6,000,000 \xD7 18% = 1,080,000. Payable = 720,000.",["Correct: output \u2013 input.","Output VAT only \u2013 input VAT not deducted.","Input VAT only.","Difference in net amounts, not VAT."]),G("hard","A clinic makes only VAT-exempt supplies. It buys equipment for TZS 5,900,000 including VAT. At what amount is the equipment recognised?",["TZS 5,900,000","TZS 5,000,000","TZS 4,838,000","TZS 5,000,000 plus a VAT receivable of 900,000"],0,"An exempt trader cannot claim input VAT, so the VAT is irrecoverable and is included in the cost of the asset (IAS 16.16).",["Correct \u2013 irrecoverable VAT is part of cost.","Only correct if the input VAT were creditable.","Wrong calculation (18% deducted from gross).","An exempt trader has no right to reclaim the VAT."]),G("hard","Which journal entry records a credit sale of TZS 2,000,000 (net) by a VAT-registered trader?",["Dr Receivables 2,360,000 / Cr Sales 2,000,000 / Cr VAT payable 360,000","Dr Receivables 2,360,000 / Cr Sales 2,360,000","Dr Receivables 2,000,000 / Cr Sales 2,000,000 and Dr VAT expense 360,000","Dr Receivables 2,360,000 / Cr Sales 2,000,000 / Cr VAT receivable 360,000"],0,"Revenue excludes VAT (collected for TRA); the VAT is a liability until paid.",["Correct.","Revenue would be overstated by the VAT.","VAT is not an expense for a registered trader.","Output VAT is a liability (payable), not an asset."])]},ias16:{match:/\b(ias ?16|revalu|revaluation|fair value|ppe|property, plant)\b/i,subject:"Financial Accounting & IFRS",topic:"IAS 16 \u2013 Revaluation model",key_terms:["revalued amount","fair value","revaluation surplus","OCI","sufficient regularity","entire class"],standards:["IAS 16","IFRS 13","IAS 36"],calc_hints:{currency:!1,vat:!1,amounts:[]},summary:"The note covers the IAS 16 revaluation model: the revalued amount is the asset\u2019s fair value at the revaluation date, and revaluations must be made with sufficient regularity so the carrying amount does not differ materially from fair value.",enkel:`Normally a building is shown at what it cost, minus depreciation. With the revaluation model the company instead shows it at what it is worth today (fair value).

If the value goes up, the increase goes to a special reserve called the revaluation surplus \u2013 not to profit.

The company must update the value regularly, so the balance sheet does not show an old, wrong value.`,avansert:`Under IAS 16.31 the carrying amount = fair value at the revaluation date \u2013 subsequent accumulated depreciation \u2013 impairment.

Increase (first revaluation), building carrying amount 400m, fair value 520m:
Dr Property, plant & equipment 120m
   Cr Revaluation surplus (OCI) 120m

A decrease goes to profit or loss, unless there is a surplus for the same asset \u2013 then it first reduces the surplus.

Rules:
\u2022 Revalue with sufficient regularity (IAS 16.34) \u2013 yearly for volatile values, every 3\u20135 years for stable ones.
\u2022 If one item is revalued, the entire class must be revalued (IAS 16.36).
\u2022 Fair value is measured under IFRS 13.`,svaert_avansert:`Exam depth:
\u2022 Reversals: an increase that reverses a previous decrease recognised in P&L goes to P&L up to that amount; the rest to OCI (IAS 16.39).
\u2022 Excess depreciation: after revaluation, depreciation is based on the revalued amount. The entity may transfer the difference between new and historical-cost depreciation from the revaluation surplus to retained earnings each year (Dr Surplus / Cr Retained earnings) \u2013 never through P&L.
\u2022 Accumulated depreciation at revaluation: either restated proportionately or eliminated against the gross amount (IAS 16.35).
\u2022 Deferred tax (IAS 12) arises on the surplus and is recognised in OCI.
\u2022 Disclosures (IAS 16.77): effective date, independent valuer, IFRS 13 level, carrying amount under the cost model, and movements in the surplus.

Pitfalls: crediting the surplus to P&L, revaluing only selected assets in a class, forgetting the deferred tax, and recycling the surplus through P&L on disposal (it is transferred directly to retained earnings).`,questions:[G("lett","Under the IAS 16 revaluation model, the revalued amount is\u2026",["Fair value at the revaluation date less subsequent depreciation and impairment","Historical cost less depreciation","Replacement cost of a new asset","The insured value"],0,"IAS 16.31 defines carrying amount under the revaluation model as fair value at the date of revaluation less subsequent accumulated depreciation and impairment losses.",["Correct.","That is the cost model.","Not the IAS 16 definition.","Insurance value is not fair value."]),G("lett","How often must revaluations be made under IAS 16?",["With sufficient regularity so carrying amount does not differ materially from fair value","Every year without exception","Every 5 years","Only when an impairment occurs"],0,"IAS 16.34 requires sufficient regularity; frequency depends on how volatile fair values are.",["Correct.","Annual revaluation is only needed if values are volatile.","There is no fixed 5-year rule.","Impairment is IAS 36, not the revaluation trigger."]),G("medium","A building with carrying amount TZS 400m is revalued for the first time to TZS 520m. Which entry is correct?",["Dr PPE 120m / Cr Revaluation surplus (OCI) 120m","Dr PPE 120m / Cr Profit or loss 120m","Dr PPE 520m / Cr Revaluation surplus 520m","Dr PPE 120m / Cr Retained earnings 120m"],0,"A first-time increase is recognised in OCI and accumulated in equity as revaluation surplus (IAS 16.39).",["Correct.","Increases go to OCI, not P&L (unless reversing a previous loss).","Only the increase is recorded, not the full value.","Retained earnings are not credited directly."]),G("medium","A company revalues one of its office buildings. What must it do with its other office buildings?",["Revalue the entire class of office buildings","Nothing \u2013 each asset is chosen separately","Revalue all PPE including vehicles","Disclose them at fair value without changing the books"],0,"IAS 16.36: if an item is revalued, the entire class to which it belongs must be revalued, to avoid selective revaluation.",["Correct.","Selective revaluation is not allowed.","Only the same class, not all PPE.","The class must be measured at revalued amounts."]),G("hard","An asset was previously revalued downwards by TZS 30m (recognised in P&L). It is now revalued upwards by TZS 50m. How is the increase recognised?",["TZS 30m in P&L and TZS 20m in OCI","TZS 50m in OCI","TZS 50m in P&L","TZS 20m in P&L and TZS 30m in OCI"],0,"An increase that reverses a previous decrease recognised in P&L is credited to P&L to that extent; the remainder goes to OCI (IAS 16.39).",["Correct.","Ignores the earlier loss in P&L.","Only the reversal part goes to P&L.","Amounts are swapped."]),G("hard","After revaluation, annual depreciation is TZS 30m; depreciation on historical cost would have been TZS 20m. What may the company do with the TZS 10m difference?",["Transfer it from revaluation surplus to retained earnings (Dr Surplus / Cr Retained earnings)","Credit it to profit or loss","Dr Retained earnings / Cr Revaluation surplus","Nothing \u2013 depreciation stays at TZS 20m"],0,"IAS 16.41 permits a reserve transfer of the excess depreciation directly within equity; it never passes through P&L.",["Correct.","The transfer is not made through P&L.","Wrong direction.","Depreciation must be based on the revalued amount."])]},ias21:{match:/\b(ias ?21|foreign currency|exchange|forex|usd|dollar|gbp|eur|valuta)\b/i,subject:"Financial Accounting & IFRS",topic:"IAS 21 \u2013 Foreign currency transactions",key_terms:["functional currency","spot rate","closing rate","monetary item","exchange difference"],standards:["IAS 21"],calc_hints:{currency:!0,vat:!1,amounts:[{amount:1e4,currency:"USD"}]},summary:"The note deals with recording foreign-currency transactions in TZS: initial recognition at the spot rate, retranslation of monetary items at the closing rate and recognition of exchange differences in profit or loss.",enkel:`When a Tanzanian company buys something in US dollars, it must record it in shillings using the exchange rate on that day.

If the company still owes the dollars at year-end, the debt is updated to the new exchange rate. If the shilling has become weaker, the company owes more shillings \u2013 that is an exchange loss.`,avansert:`IAS 21.21: initial recognition at the spot rate on the transaction date.
IAS 21.23: at the reporting date, monetary items (cash, receivables, payables, loans) use the closing rate; non-monetary items at historical cost (inventory, PPE) stay at the historical rate.

Example: goods bought on credit for USD 10,000 at 2,600 = TZS 26,000,000.
Dr Inventory 26,000,000 / Cr Payables 26,000,000
Year-end rate 2,650 \u2192 payable = 26,500,000:
Dr Exchange loss (P&L) 500,000 / Cr Payables 500,000`,svaert_avansert:`Exam depth:
\u2022 Exchange differences on monetary items go to P&L (IAS 21.28), except on a net investment in a foreign operation (OCI in consolidated statements).
\u2022 Non-monetary items at fair value use the rate at the date fair value was measured; any gain follows where the fair value change goes (P&L or OCI).
\u2022 Inventory bought in foreign currency stays at the historical rate, but the NRV test (IAS 2) uses the closing rate.
\u2022 Functional currency (IAS 21.9) is decided by the primary economic environment \u2013 currency of sales prices, costs and financing \u2013 not simply the currency of the reporting country.
\u2022 Translation of a foreign operation for consolidation: assets/liabilities at closing rate, income/expenses at transaction (or average) rates, differences to OCI (translation reserve).

Pitfalls: retranslating inventory or PPE at the closing rate, and putting settlement gains in OCI.`,questions:[G("lett","An entity\u2019s functional currency is\u2026",["The currency of the primary economic environment in which it operates","Always the currency of the country where it is registered","The currency of its largest supplier","USD for all companies that export"],0,"IAS 21.8\u20139 defines functional currency by the primary economic environment (sales prices, costs, financing).",["Correct.","Registration country is not decisive.","One supplier alone does not decide it.","Not automatically USD."]),G("lett","A foreign-currency transaction is initially recorded at\u2026",["The spot rate on the transaction date","The closing rate at year-end","The average rate for the year, always","The budget rate"],0,"IAS 21.21: spot rate at the date of the transaction (an average rate may be used as an approximation if rates do not fluctuate significantly).",["Correct.","Closing rate is used at the reporting date.","Average is only an allowed approximation.","Budget rates are not allowed."]),G("medium","Goods are bought on credit for USD 10,000 when 1 USD = TZS 2,600. At year-end the rate is 2,650 and the invoice is unpaid. What is reported?",["Payable TZS 26,500,000 and an exchange loss of TZS 500,000","Payable TZS 26,000,000 and no exchange difference","Payable TZS 26,500,000 and an exchange gain of TZS 500,000","Payable TZS 26,000,000 and a loss of TZS 500,000 in OCI"],0,"The payable is a monetary item \u2192 closing rate: 10,000 \xD7 2,650 = 26,500,000. The increase of 500,000 is a loss in P&L.",["Correct.","Monetary items must be retranslated.","A higher liability is a loss, not a gain.","The payable must be retranslated and the loss goes to P&L."]),G("medium","Which items are retranslated at the closing rate at the reporting date?",["Monetary items such as receivables, payables and loans","Inventory and PPE at historical cost","Share capital","All items in the statement of financial position"],0,"IAS 21.23(a): monetary items use the closing rate.",["Correct.","Non-monetary items at cost keep the historical rate.","Share capital is non-monetary.","Only monetary items."]),G("hard","The payable above (TZS 26,500,000 at year-end) is settled in the next year when 1 USD = TZS 2,630. What is recognised on settlement?",["An exchange gain of TZS 200,000","An exchange loss of TZS 300,000","An exchange gain of TZS 300,000","No gain or loss"],0,"Cash paid 10,000 \xD7 2,630 = 26,300,000 against a carrying amount of 26,500,000 \u2192 gain 200,000 in P&L.",["Correct.","Compares with the original rate, not the carrying amount.","Uses the original 26,000,000 incorrectly.","A settlement difference must be recognised."]),G("hard","Inventory bought for USD 5,000 at 2,600 is still held at year-end (closing rate 2,650, NRV above cost). At what amount is it reported?",["TZS 13,000,000","TZS 13,250,000","TZS 13,125,000","USD 5,000 with no TZS amount"],0,"Inventory is non-monetary at cost \u2192 stays at the historical rate (5,000 \xD7 2,600). The closing rate is only used for the NRV test.",["Correct.","Retranslating at closing rate is wrong for non-monetary items.","No average-rate rule applies here.","Must be reported in functional currency."])]}};Et.ias16.exam={title:"Kilimanjaro Hotels Ltd \u2013 Revaluation of a building",scenario:"Kilimanjaro Hotels Ltd bought a hotel building on 1 January 2020 for TZS 800m. Useful life 40 years, no residual value, straight-line depreciation. On 1 January 2025 the company changed to the revaluation model for land and buildings. An independent valuer measured the building\u2019s fair value at TZS 1,050m on that date (remaining life 35 years). The company transfers excess depreciation to retained earnings each year. On 31 December 2026 the fair value was TZS 900m. Accumulated depreciation is eliminated against the gross carrying amount on revaluation.",parts:[{label:"(a)",marks:6,task:"Calculate the carrying amount at 1 January 2025 and prepare the journal entries for the revaluation on that date.",solution:`Depreciation 2020\u20132024: 800 \xF7 40 = 20m \xD7 5 years = 100m
Carrying amount 1.1.2025 = 800 \u2212 100 = 700m
Revaluation surplus = 1,050 \u2212 700 = 350m

Dr Accumulated depreciation 100m / Cr Building 100m
Dr Building 350m / Cr Revaluation surplus (OCI) 350m`,key_points:["Depreciation 100m (2)","Carrying amount 700m (1)","Surplus 350m to OCI (1)","Correct entries (2)"]},{label:"(b)",marks:6,task:"Calculate depreciation for 2025 and 2026 and show the excess depreciation transfer.",solution:`New depreciation = 1,050 \xF7 35 = 30m per year
Depreciation on cost would be 20m \u2192 excess 10m per year

Each year:
Dr Depreciation expense 30m / Cr Accumulated depreciation 30m
Dr Revaluation surplus 10m / Cr Retained earnings 10m (transfer within equity, not through P&L)`,key_points:["30m per year (2)","Excess 10m (2)","Transfer within equity (2)"]},{label:"(c)",marks:6,task:"Account for the revaluation on 31 December 2026.",solution:`Carrying amount 31.12.2026 = 1,050 \u2212 60 = 990m
Fair value 900m \u2192 decrease 90m
Revaluation surplus balance = 350 \u2212 10 \u2212 10 = 330m \u2265 90m \u2192 whole decrease to OCI, nothing in P&L

Dr Accumulated depreciation 60m / Cr Building 60m
Dr Revaluation surplus (OCI) 90m / Cr Building 90m`,key_points:["Carrying amount 990m (2)","Surplus balance 330m (2)","Decrease to OCI, not P&L (2)"]},{label:"(d)",marks:2,task:"State two disclosures required by IAS 16 for revalued assets.",solution:"Any two of: effective date of revaluation; whether an independent valuer was involved; carrying amount under the cost model (800 \u2212 7 \xD7 20 = 660m); IFRS 13 fair value hierarchy level; movements in the revaluation surplus.",key_points:["Any two valid disclosures (1 each)"]}],total_marks:20};Et.ias16.gaps=[{title:"IAS 36 \u2013 Impairment of revalued assets",why:"Exams combine revaluation with impairment.",preview:"An impairment loss on a revalued asset is first charged to the revaluation surplus for that asset; any excess goes to profit or loss."},{title:"IAS 12 \u2013 Deferred tax on revaluation surplus",why:"A frequent adjustment in consolidation and single-entity questions.",preview:"A revaluation creates a taxable temporary difference; the deferred tax is recognised in OCI, reducing the surplus."},{title:"Disposal of a revalued asset",why:"Students often recycle the surplus through P&L by mistake.",preview:"On disposal the remaining surplus is transferred directly to retained earnings \u2013 never through profit or loss."}];Et.vat.gaps=[{title:"Apportionment of input VAT (mixed supplies)",why:"Required when a trader makes both taxable and exempt supplies.",preview:"Input VAT that relates to both kinds of supplies is split, usually in the ratio of taxable to total supplies."},{title:"VAT registration threshold and deadlines",why:"Short factual questions in tax papers.",preview:"Check the current threshold and the monthly return deadline in the VAT Act and TRA guidance \u2013 they change with Finance Acts."}];var on={"Financial Accounting & IFRS":[{title:"IAS 36 \u2013 Impairment of assets",why:"Asked together with PPE and goodwill.",priority:"high"},{title:"IFRS 16 \u2013 Leases",why:"Lessee accounting is a sta
