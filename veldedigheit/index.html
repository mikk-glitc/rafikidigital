<title>Ei hand frå oven – Rafiki Digital</title>
<meta name="description" content="Ei hand frå oven – veldedigheitsarbeidet til Rafiki Digital, der Noreg og Afrika møtest.">

<style>
  :root {
    --himmel: #DDE5E4;
    --fjord:  #2C3E46;
    --furu:   #26382F;
    --sol:    #C99A4B;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body { margin: 0; background: var(--furu); color: #E4EAE6; font-family: "Spectral", Georgia, serif; font-weight: 300; font-size: 1.1875rem; line-height: 1.7; }
  a { color: #E4EAE6; text-decoration-color: var(--sol); text-underline-offset: .2em; text-decoration-thickness: 1px; }
  a:focus-visible { outline: 2px solid var(--sol); outline-offset: 3px; }

  /* Bakgrunnsbiletet: Noreg og Afrika som smeltar saman, med hendene i midten */
  .hand { position: relative; height: min(92vh, 900px); min-height: 460px; overflow: hidden; background: #2e4560; }
  .hand > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* Meny: same oppsett som framsida, lys tekst over den mørke himmelen */
  .meny { position: absolute; top: 0; left: 0; right: 0; z-index: 2; background: linear-gradient(rgba(12,20,28,.55), rgba(12,20,28,0)); }
  .meny .inn { max-width: 62rem; margin: 0 auto; padding: 1.1rem 1.5rem 1.6rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .meny a { color: #F2F4F1; text-shadow: 0 1px 8px rgba(8,14,20,.6); }
  .meny .merke { font-weight: 600; font-size: 1.05rem; text-decoration: none; letter-spacing: .01em; }
  .meny ul { list-style: none; margin: 0; padding: 0; display: flex; gap: .3rem 1.4rem; flex-wrap: wrap; }
  .meny ul a { text-decoration: none; font-size: 1rem; font-weight: 400; }
  .meny ul a:hover, .meny ul a[aria-current="page"] { text-decoration: underline; text-decoration-color: var(--sol); }

  .tekst { max-width: 38rem; margin: 0 auto; padding: 3rem 1.5rem 2rem; }
  .tekst h1 { font-weight: 400; font-size: 2.4rem; line-height: 1.15; margin: 0 0 .8rem; color: #F2F4F1; }
  .tekst p { margin: 0 0 1.1rem; }
  footer { background: var(--furu); color: #93A89C; font-size: .95rem; text-align: center; padding: 3.5rem 1.5rem 3rem; }

  @media (max-width: 34rem) {
    body { font-size: 1.0625rem; }
    .meny .inn { padding: .9rem 1.2rem 1.4rem; }
    .meny ul { gap: .2rem 1rem; }
    .meny ul a { font-size: .95rem; }
  }

  /* Rørsle i biletet */
@keyframes aurora{0%{transform:translateX(-36px) scaleY(0.94)}50%{transform:translateX(18px) scaleY(1.06)}100%{transform:translateX(36px) scaleY(0.97)}}
@keyframes curtain{0%{opacity:0.45}50%{opacity:1}100%{opacity:0.6}}
@keyframes pulse{0%{transform:scale(0.92);opacity:0.75}100%{transform:scale(1.07);opacity:1}}
@keyframes flowR{to{stroke-dashoffset:-660}}
@keyframes flowL{to{stroke-dashoffset:640}}
@keyframes tideR{0%{transform:translateX(-18px)}100%{transform:translateX(26px)}}
@keyframes tideL{0%{transform:translateX(18px)}100%{transform:translateX(-26px)}}
@keyframes mote{0%{transform:translateY(20px);opacity:0}20%{opacity:0.7}100%{transform:translateY(-90px);opacity:0}}
@keyframes heartbeat{0%,100%{opacity:0.5}12%{opacity:0.66}24%{opacity:0.55}36%{opacity:0.68}60%{opacity:0.52}}
@keyframes rays{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes ray{0%{opacity:0.1;transform:scale(0.85)}50%{opacity:0.7;transform:scale(1.05)}100%{opacity:0.18;transform:scale(0.9)}}
@keyframes shimmer{0%,100%{opacity:0.1}50%{opacity:0.75}}
.anim-aurora{transform-box:fill-box;transform-origin:center;animation:aurora 16s ease-in-out infinite alternate}
.anim-curtain{animation:curtain 5s ease-in-out infinite alternate}
.anim-pulse{transform-box:fill-box;transform-origin:center;animation:pulse 4.5s ease-in-out infinite alternate}
.anim-flowR{animation:flowR 14s linear infinite}
.anim-flowL{animation:flowL 16s linear infinite}
.anim-tideR{animation:tideR 8s ease-in-out infinite alternate}
.anim-tideL{animation:tideL 8s ease-in-out infinite alternate}
.anim-mote{animation:mote 10s ease-in-out infinite}
.anim-heartbeat{transform-box:fill-box;transform-origin:center;animation:heartbeat 3.2s ease-in-out infinite}
.anim-rays{animation:rays 120s linear infinite}
.anim-ray{animation:ray 6s ease-in-out infinite}
.anim-shimmer{animation:shimmer 3.5s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.anim-aurora,.anim-curtain,.anim-pulse,.anim-flowR,.anim-flowL,.anim-tideR,.anim-tideL,.anim-mote,.anim-shimmer,.anim-heartbeat,.anim-rays,.anim-ray{animation:none}}

</style>
</head>
